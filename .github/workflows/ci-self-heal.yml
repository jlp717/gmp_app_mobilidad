name: CI Failure Metadata

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: Workflow run identifier to inspect without downloading logs or changing GitHub state.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Inspect trusted failure metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and summarize execution metadata
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          WORKFLOW_RUN_ID: ${{ inputs.workflow_run_id }}
        with:
          script: |
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const dispatchId = String(process.env.WORKFLOW_RUN_ID || '').trim();
            const payloadRun = context.payload.workflow_run;
            let runId;

            if (payloadRun) {
              runId = payloadRun.id;
            } else if (/^[1-9]\d{0,15}$/.test(dispatchId)) {
              runId = Number(dispatchId);
            } else {
              core.setFailed('workflow_run_id must be a positive safe integer');
              return;
            }

            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed('workflow run id is invalid');
              return;
            }

            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const sha = String(run.head_sha || '').toLowerCase();
            const headCommitSha = String(run.head_commit?.id || '').toLowerCase();
            const sourceRepository = run.head_repository?.full_name;
            const valid = run.id === runId &&
              run.repository?.full_name === expectedRepository &&
              sourceRepository === expectedRepository &&
              run.head_repository?.fork === false &&
              run.status === 'completed' &&
              /^[0-9a-f]{40}$/.test(sha) &&
              (!headCommitSha || headCommitSha === sha);
            if (!valid) {
              core.setFailed('workflow run did not satisfy trusted repository, id, status, or SHA checks');
              return;
            }

            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const bounded = (value, fallback = 'unknown') => String(value || fallback)
              .replace(/[^A-Za-z0-9 ._:/-]/g, '_').slice(0, 96);
            const counts = jobs.jobs.reduce((result, job) => {
              const key = bounded(job.conclusion || job.status, 'unknown');
              result[key] = (result[key] || 0) + 1;
              return result;
            }, {});
            const conclusion = bounded(run.conclusion);
            core.notice(`trusted workflow run ${run.id}: ${conclusion}, jobs=${jobs.total_count}`);
            await core.summary
              .addHeading('CI failure metadata (read only)')
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['Run', String(run.id)],
                ['SHA', sha.slice(0, 12)],
                ['Conclusion', conclusion],
                ['Jobs by conclusion', Object.entries(counts).map(([key, value]) => `${key}:${value}`).join(', ').slice(0, 240)],
              ])
              .addRaw('No logs were downloaded. No workflow, GitHub, repository, or messaging mutation was requested.')
              .write();
