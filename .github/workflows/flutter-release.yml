name: Flutter Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test with coverage
        run: flutter test --coverage

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Tags and history anchor release notes and artifact traceability.
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          umask 077
          signing_dir="$RUNNER_TEMP/android-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/upload-keystore.jks"
          chmod 600 "$signing_dir/upload-keystore.jks"
      - name: Generate runtime signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          signing_dir="$RUNNER_TEMP/android-signing"
          {
            printf 'storeFile=%s/upload-keystore.jks\n' "$signing_dir"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > "$signing_dir/key.properties"
          chmod 600 "$signing_dir/key.properties"
          ln -s "$signing_dir/key.properties" android/key.properties
      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(awk '/^version:/{print $2; exit}' pubspec.yaml)" >> "$GITHUB_OUTPUT"
      - name: Build signed app bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Build signed APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Generate tag-based changelog
        shell: bash
        run: |
          current_tag="$(git tag --points-at HEAD | head -n 1)"
          if [[ -n "$current_tag" ]]; then
            previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          else
            previous_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi

          if [[ -n "$previous_tag" ]]; then
            commit_subjects="$(git log "${previous_tag}..HEAD" --pretty=format:%s)"
          else
            commit_subjects="$(git log --pretty=format:%s)"
          fi

          changelog="$(printf '%s\n' "$commit_subjects" \
            | grep -E '^(feat|fix|perf|refactor|docs|chore|ci)(\(.+\))?!?: ' \
            | sed 's/^/- /' || true)"
          if [[ -z "$changelog" ]]; then
            changelog='Sin cambios desde ultimo tag'
          fi
          printf '%s\n' "$changelog" > release-notes.txt
          {
            echo 'RELEASE_NOTES<<__RELEASE_NOTES__'
            cat release-notes.txt
            echo '__RELEASE_NOTES__'
          } >> "$GITHUB_ENV"
          # ponytail: commits convencionales como notas sin curación. upgrade: generar notas editoriales cuando distribución salga del grupo interno.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          # run_number + short SHA identify build and source commit.
          name: gmp-aab-${{ github.run_number }}-${{ steps.release_meta.outputs.short_sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmp-apk-${{ github.run_number }}-${{ steps.release_meta.outputs.short_sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
          working-directory: android
      - name: Distribute APK through Firebase
        id: firebase_distribution
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        working-directory: android
        shell: bash
        run: |
          if [[ -z "$FIREBASE_CLI_TOKEN" || -z "$FIREBASE_APP_ID" ]]; then
            echo 'distributed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bundle lock
          bundle install --jobs 4 --retry 3
          bundle exec fastlane firebase
          echo 'distributed=true' >> "$GITHUB_OUTPUT"
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_VERSION: ${{ steps.release_meta.outputs.version }}
          SHORT_SHA: ${{ steps.release_meta.outputs.short_sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          FIREBASE_DISTRIBUTED: ${{ steps.firebase_distribution.outputs.distributed }}
        shell: bash
        run: |
          if [[ "$FIREBASE_DISTRIBUTED" == 'true' ]]; then
            channel='Firebase App Distribution (APK)'
          else
            channel='artifacts disponibles en GitHub Actions (sin distribución)'
          fi
          text="$(printf 'Version: %s\nBuild: %s\nCommit: %s (%s)\nCanal: %s\n\nCambios:\n%s' \
            "$APP_VERSION" "${{ github.run_number }}" "$SHORT_SHA" "$COMMIT_URL" "$channel" "$RELEASE_NOTES")"
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo 'Telegram no configurado; se omite la notificacion.'
            exit 0
          fi
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$text" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
      - name: Clean temporary signing files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f android/key.properties
          rm -rf "$RUNNER_TEMP/android-signing"
