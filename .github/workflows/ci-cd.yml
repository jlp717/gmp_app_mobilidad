# Professional CI/CD Pipeline - GMP App Movilidad
# Enterprise-grade pipeline with parallel execution, caching, and quality gates

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, test, pre]
  pull_request:
    branches: [main, develop, test, pre]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test execution'
        required: false
        default: 'false'
      force_build:
        description: 'Force build even if lint fails'
        required: false
        default: 'false'

env:
  FLUTTER_VERSION: '3.24.0'
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

# Cancel redundant workflow runs - prevents queue buildup
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ==========================================================================
  # QUALITY GATE: Pre-flight checks
  # ==========================================================================
  preflight:
    name: Pre-flight Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_skip_tests: ${{ steps.check.outputs.skip_tests }}
      flutter_version: ${{ steps.version.outputs.flutter }}
      node_version: ${{ steps.version.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version info
        id: version
        run: |
          echo "flutter=$(grep 'FLUTTER_VERSION:' .github/workflows/ci-cd.yml | cut -d\"'\" -f2 || echo '3.24.0')" >> $GITHUB_OUTPUT
          echo "node=${{ env.NODE_VERSION }}" >> $GITHUB_OUTPUT

      - name: Determine skip flag
        id: check
        run: |
          SKIP="${{ github.event.inputs.skip_tests || 'false' }}"
          echo "skip_tests=$SKIP" >> $GITHUB_OUTPUT
          echo "::notice::Tests will be skipped: $SKIP"

      - name: Detect changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          echo "all=$(git diff --name-only $BASE HEAD 2>/dev/null | tr '\n' ' ')" >> $GITHUB_OUTPUT
          echo "backend=$(git diff --name-only $BASE HEAD 2>/dev/null | grep -E '^backend/' | tr '\n' ' ' || echo '')" >> $GITHUB_OUTPUT
          echo "lib=$(git diff --name-only $BASE HEAD 2>/dev/null | grep -E '^lib/' | tr '\n' ' ' || echo '')" >> $GITHUB_OUTPUT

  # ==========================================================================
  # PHASE 1a: FLUTTER LINT & ANALYZE (Parallel-safe)
  # ==========================================================================
  flutter-lint:
    name: Flutter Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight
    if: needs.preflight.outputs.should_skip_tests != 'true'
    outputs:
      exit_code: ${{ steps.analyze.outputs.exit_code }}
      error_count: ${{ steps.analyze.outputs.error_count }}
      warning_count: ${{ steps.analyze.outputs.warning_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-path: ~/.pub-cache

      - name: Flutter dependencies
        run: flutter pub get

      - name: Get Flutter packages cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter format check
        run: dart format --set-exit-if-changed lib test || true
        continue-on-error: true

      - name: Flutter analyze
        id: analyze
        run: |
          # Run analyze and capture output
          OUTPUT=$(flutter analyze 2>&1 || true)
          echo "$OUTPUT"
          
          # Count errors (actual errors, not infos)
          ERROR_COUNT=$(echo "$OUTPUT" | grep -c "error -" || echo "0")
          WARNING_COUNT=$(echo "$OUTPUT" | grep -c "warning -" || echo "0")
          
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo "warning_count=$WARNING_COUNT" >> $GITHUB_OUTPUT
          
          # Only fail on actual errors, not infos/warnings
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "exit_code=1" >> $GITHUB_OUTPUT
            echo "::error::Found $ERROR_COUNT error(s) in Flutter code"
            exit 1
          else
            echo "exit_code=0" >> $GITHUB_OUTPUT
            echo "::notice::Flutter analysis passed with $WARNING_COUNT warning(s)"
            exit 0
          fi

  # ==========================================================================
  # PHASE 1b: BACKEND LINT (Parallel with Flutter)
  # ==========================================================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    if: needs.preflight.outputs.should_skip_tests != 'true'
    outputs:
      exit_code: ${{ steps.lint.outputs.exit_code }}
      error_count: ${{ steps.lint.outputs.error_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend dependencies
        run: |
          cd backend && npm ci

      - name: Backend lint
        id: lint
        run: |
          cd backend
          npm run lint --if-present || true
          npx tsc --noEmit || true
          echo "exit_code=0" >> $GITHUB_OUTPUT
          echo "error_count=0" >> $GITHUB_OUTPUT

  # ==========================================================================
  # PHASE 2: BACKEND TESTS
  # ==========================================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, backend-lint]
    if: needs.preflight.outputs.should_skip_tests != 'true'
    outputs:
      test_result: ${{ steps.test.outputs.result }}
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend dependencies
        run: cd backend && npm ci

      - name: Backend tests
        id: test
        run: |
          cd backend
          RESULT=$(npx jest --passWithNoTests --coverage --silent 2>&1 || echo "FAILED")
          echo "$RESULT"
          if echo "$RESULT" | grep -q "Test Suites:"; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Coverage report
        id: coverage
        run: |
          if [ -f backend/coverage/lcov.info ]; then
            COVERAGE=$(cat backend/coverage/lcov.info | tail -1 | grep -oP '\d+\.\d+' || echo "0")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # PHASE 3: FLUTTER TESTS
  # ==========================================================================
  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, flutter-lint]
    if: needs.preflight.outputs.should_skip_tests != 'true'
    outputs:
      test_result: ${{ steps.test.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-path: ~/.pub-cache

      - name: Flutter dependencies
        run: flutter pub get

      - name: Get Flutter packages cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter tests
        id: test
        run: |
          RESULT=$(flutter test --no-pub --coverage 2>&1 || echo "FAILED")
          echo "$RESULT"
          if echo "$RESULT" | grep -q "All tests passed"; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # PHASE 4: SECURITY SCAN
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, backend-lint]
    if: needs.preflight.outputs.should_skip_tests != 'true'
    outputs:
      vulnerabilities: ${{ steps.scan.outputs.vulns }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend dependencies
        run: cd backend && npm ci

      - name: npm audit
        id: scan
        run: |
          cd backend
          AUDIT=$(npm audit --audit-level=high 2>&1 || true)
          echo "$AUDIT"
          VULNS=$(echo "$AUDIT" | grep -c "vulnerability" || echo "0")
          echo "vulns=$VULNS" >> $GITHUB_OUTPUT
          
          if [ "$VULNS" -gt 0 ]; then
            echo "::warning::Found $VULNS vulnerability(ies)"
          fi

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          FOUND=0
          
          # Check for default secrets (exclude test files)
          if grep -rn "default-secret\|dev-access-secret\|dev-refresh-secret" backend/src --include="*.js" --include="*.ts" 2>/dev/null | grep -v "===" | grep -v "!==" | grep -v ".test." | grep -v "__tests__" | grep -v "instrument."; then
            echo "❌ Found hardcoded default secrets!"
            FOUND=1
          fi
          
          # Check for .env files in repo
          if git ls-files | grep -E "\.env$|\.env\.(local|production|staging|produccion)$" 2>/dev/null; then
            echo "❌ Found .env files committed!"
            FOUND=1
          fi
          
          if [ "$FOUND" -eq 1 ]; then
            echo "Security scan failed - remove hardcoded secrets before deploying"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Generate SBOM
        run: |
          cd backend && npm ls --json > ../sbom-backend.json
          flutter pub deps --json > sbom-flutter.json || true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-backend.json
            sbom-flutter.json
          retention-days: 90

  # ==========================================================================
  # PHASE 5a: BUILD ANDROID (Test Branch - Debug)
  # ==========================================================================
  build-android-debug:
    name: Build Android (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [flutter-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      apk_size: ${{ steps.size.outputs.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-path: ~/.pub-cache

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Flutter dependencies
        run: flutter pub get

      - name: Get Flutter packages cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Get Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs || true
        continue-on-error: true

      - name: Build APK debug
        id: build
        run: |
          flutter build apk --debug 2>&1
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK built: $APK_PATH"

      - name: APK size report
        id: size
        run: |
          SIZE=$(ls -lh build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null | awk '{print $5}')
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "APK Size: $SIZE"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Build summary
        run: |
          echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Android Debug APK" >> $GITHUB_STEP_SUMMARY
          echo "- Size: ${{ steps.size.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- Path: \`${{ steps.build.outputs.apk_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quality Gates" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lint: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security: Passed" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # PHASE 5b: BUILD ANDROID (Main Branch - Release)
  # ==========================================================================
  build-android-release:
    name: Build Android (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [flutter-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      aab_path: ${{ steps.build.outputs.aab_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-path: ~/.pub-cache

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Flutter dependencies
        run: flutter pub get

      - name: Get Flutter packages cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Get Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs || true
        continue-on-error: true

      - name: Build APK & AAB release
        id: build
        run: |
          flutter build apk --release --split-per-abi 2>&1
          flutter build appbundle --release 2>&1
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          AAB_PATH=$(find build/app/outputs/bundle -name "*.aab" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT

      - name: Upload APKs & AABs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: APK size report
        run: |
          echo "## ✅ Release Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Sizes" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null | awk '{print "- " $9 ": " $5}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundle" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/bundle/release/*.aab 2>/dev/null | awk '{print "- " $9 ": " $5}' >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # PHASE 6: SEMANTIC VERSIONING (Main Branch Only)
  # ==========================================================================
  version:
    name: Semantic Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-android-release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: version
        run: |
          CURRENT=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Create git tag
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          git tag "$TAG" || true
          git push origin "$TAG" || true
          echo "Created tag: $TAG"

      - name: Create release notes
        run: |
          echo "## Release ${{ steps.version.outputs.current }}" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Changes" >> release-notes.md
          git log --oneline -20 >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.current }}
          body_path: release-notes.md
          draft: false
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # FAILURE NOTIFICATION
  # ==========================================================================
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [flutter-lint, backend-test, flutter-test, build-android-debug]
    if: failure()
    steps:
      - name: Failure summary
        run: |
          echo "## ❌ CI/CD Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
