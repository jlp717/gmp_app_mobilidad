# Professional CI/CD Pipeline - GMP App Movilidad
# Enterprise-grade pipeline with parallel execution, caching, and quality gates

name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test execution'
        required: false
        default: 'false'
      force_build:
        description: 'Force build even if lint fails'
        required: false
        default: 'false'

env:
  FLUTTER_VERSION: '3.35.6'
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  # Allow Node 20 actions to run on their native runtime (compat mode after Node 20 deprecation)
  ACTIONS_ALLOW_USE_OF_NODE20: 'true'

# Cancel redundant workflow runs - prevents queue buildup
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ==========================================================================
  # QUALITY GATE: Pre-flight checks
  # ==========================================================================
  preflight:
    name: Pre-flight Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_skip_tests: ${{ steps.check.outputs.skip_tests }}
      flutter_version: ${{ steps.version.outputs.flutter }}
      node_version: ${{ steps.version.outputs.node }}
    steps:
      - name: Checkout with full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2

      - name: Check version info
        id: version
        run: |
          echo "flutter=${FLUTTER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "node=${{ env.NODE_VERSION }}" >> "$GITHUB_OUTPUT"

      - name: Determine skip flag
        id: check
        run: |
          SKIP="${{ github.event.inputs.skip_tests || 'false' }}"
          echo "skip_tests=$SKIP" >> "$GITHUB_OUTPUT"
          echo "::notice::Tests will be skipped: $SKIP"

      - name: Detect changed files
        id: changes
        continue-on-error: true
        run: |
          CHANGED=""
          BACKEND=""
          LIB=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            # Use FETCH_HEAD or HEAD~1, fallback to empty if not enough history
            BASE="HEAD~1"
            git rev-parse --quiet HEAD~1 2>/dev/null || BASE="$(git log --oneline --max-count=1 --format='%H' 2>/dev/null || echo 'HEAD')"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null | tr '\n' ' ' || echo "")
          BACKEND=$(echo "$CHANGED" | grep -E '^backend/' | tr '\n' ' ' || echo "")
          LIB=$(echo "$CHANGED" | grep -E '^lib/' | tr '\n' ' ' || echo "")
          echo "all=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "lib=$LIB" >> "$GITHUB_OUTPUT"
          echo "::debug::Changed files: [$CHANGED]"

  # ==========================================================================
  # PHASE 1a: FLUTTER LINT & ANALYZE (Parallel-safe)
  # ==========================================================================
  flutter-lint:
    name: Flutter Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight
    if: needs.preflight.outputs.should_skip_tests != 'true'
    outputs:
      exit_code: ${{ steps.analyze.outputs.exit_code }}
      error_count: ${{ steps.analyze.outputs.error_count }}
      warning_count: ${{ steps.analyze.outputs.warning_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-path: ~/.pub-cache

      - name: Flutter dependencies
        run: flutter pub get

      - name: Get Flutter packages cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        id: analyze
        run: |
          mkdir -p /tmp/ci-artifacts
          set +e
          OUTPUT=$(flutter analyze --no-fatal-infos 2>&1)
          ANALYZE_STATUS=$?
          set -e
          echo "$OUTPUT"
          
          # Save full output for self-heal workflow
          echo "$OUTPUT" > /tmp/ci-artifacts/flutter-analyze.log
          
          # Count errors (actual errors, not infos)
          ERROR_COUNT=$(echo "$OUTPUT" | grep -c "error -" || echo "0")
          WARNING_COUNT=$(echo "$OUTPUT" | grep -c "warning -" || echo "0")
          
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo "warning_count=$WARNING_COUNT" >> $GITHUB_OUTPUT
          
          # Only fail on actual errors, not infos/warnings
          if [ "$ANALYZE_STATUS" -ne 0 ] || [ "$ERROR_COUNT" -gt 0 ]; then
            echo "exit_code=1" >> $GITHUB_OUTPUT
            echo "::error::Flutter analyze failed with $ERROR_COUNT error(s)"
            # Extract error locations for rapid diagnosis
            echo "$OUTPUT" | grep "error -" | head -10 | sed 's/^/  ::error file=/'
            exit 1
          else
            echo "exit_code=0" >> $GITHUB_OUTPUT
            echo "::notice::Flutter analysis passed with $WARNING_COUNT warning(s)"
            exit 0
          fi

  # ==========================================================================
  # PHASE 1b: BACKEND LINT (Parallel with Flutter)
  # ==========================================================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    if: needs.preflight.outputs.should_skip_tests != 'true'
    outputs:
      exit_code: ${{ steps.lint.outputs.exit_code }}
      error_count: ${{ steps.lint.outputs.error_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend lint
        id: lint
        run: |
          mkdir -p /tmp/ci-artifacts
          cd backend
          
          # ESLint
          set +e
          LINT_OUTPUT=$(npm run lint --if-present 2>&1)
          LINT_STATUS=$?
          echo "::group::ESLint output"
          echo "$LINT_OUTPUT"
          echo "::endgroup::"
          
          # TypeScript check
          TSC_OUTPUT=$(npx tsc --noEmit 2>&1)
          TSC_STATUS=$?
          set -e
          echo "::group::TypeScript output"
          echo "$TSC_OUTPUT"
          echo "::endgroup::"
          
          # Save for self-heal workflow
          echo "$LINT_OUTPUT" > /tmp/ci-artifacts/eslint.log
          echo "$TSC_OUTPUT" > /tmp/ci-artifacts/tsc.log
          
          # Count errors
          TSC_ERRORS=$(echo "$TSC_OUTPUT" | grep -c "error TS" || echo "0")
          if [ "$LINT_STATUS" -ne 0 ] || [ "$TSC_STATUS" -ne 0 ] || [ "$TSC_ERRORS" -gt 0 ]; then
            echo "exit_code=1" >> $GITHUB_OUTPUT
            echo "error_count=$TSC_ERRORS" >> $GITHUB_OUTPUT
            echo "::error::Backend lint/typecheck failed"
            exit 1
          else
            echo "exit_code=0" >> $GITHUB_OUTPUT
            echo "error_count=0" >> $GITHUB_OUTPUT
          fi

  # ==========================================================================
  # PHASE 2: BACKEND TESTS
  # ==========================================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, backend-lint]
    if: needs.preflight.outputs.should_skip_tests != 'true'
    outputs:
      test_result: ${{ steps.test.outputs.result }}
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend tests
        id: test
        run: |
          mkdir -p /tmp/ci-artifacts
          cd backend
          set +e
          RESULT=$(npm run test:ci -- --coverage --silent 2>&1)
          TEST_STATUS=$?
          set -e
          echo "$RESULT"
          
          # Save for self-heal workflow
          echo "$RESULT" > /tmp/ci-artifacts/jest.log
          
          if [ "$TEST_STATUS" -eq 0 ]; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
            # Extract failed test names for rapid diagnosis
            echo "$RESULT" | grep -B1 "â—" | grep -v "^--$" | head -10 | while read line; do
              echo "::error::Test failed: $line"
            done
            exit 1
          fi

      - name: Coverage report
        id: coverage
        run: |
          if [ -f backend/coverage/lcov.info ]; then
            COVERAGE=$(cat backend/coverage/lcov.info | tail -1 | grep -oP '\d+\.\d+' || echo "0")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        if: always()
        with:
          files: backend/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # PHASE 3: FLUTTER TESTS
  # ==========================================================================
  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, flutter-lint]
    if: needs.preflight.outputs.should_skip_tests != 'true'
    outputs:
      test_result: ${{ steps.test.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-path: ~/.pub-cache

      - name: Flutter dependencies
        run: flutter pub get

      - name: Get Flutter packages cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Flutter tests
        id: test
        run: |
          mkdir -p /tmp/ci-artifacts
          RESULT=$(flutter test --no-pub --coverage 2>&1 || echo "FAILED")
          echo "$RESULT"
          
          # Save for self-heal workflow
          echo "$RESULT" > /tmp/ci-artifacts/flutter-test.log
          
          if echo "$RESULT" | grep -q "All tests passed"; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
            # Extract failing test names
            echo "$RESULT" | grep -E "^\d+:\d+" | head -10 | while read line; do
              echo "::error::Test location: $line"
            done
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        if: always()
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================================================
  # PHASE 4: SECURITY SCAN
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [preflight, backend-lint]
    if: needs.preflight.outputs.should_skip_tests != 'true'
    outputs:
      vulnerabilities: ${{ steps.scan.outputs.vulns }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend dependencies
        working-directory: backend
        run: npm ci

      - name: npm audit
        id: scan
        run: |
          cd backend
          AUDIT=$(npm audit --audit-level=high 2>&1 || true)
          echo "$AUDIT"
          # grep -c outputs "0" on stdout even with exit code 1; use || true to avoid double output
          VULNS=$(echo "$AUDIT" | grep -c "vulnerability" || true)
          echo "vulns=$VULNS" >> "$GITHUB_OUTPUT"
          
          if [ "$VULNS" -gt 0 ] 2>/dev/null; then
            echo "::warning::Found $VULNS vulnerability(ies)"
          fi

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          FOUND=0
          
          # Check for default secrets (exclude test files)
          SECRET_MATCHES=$(grep -rn "default-secret\|dev-access-secret\|dev-refresh-secret" backend --include="*.js" --include="*.ts" 2>/dev/null | grep -v "===" | grep -v "!==" | grep -v ".test." | grep -v "__tests__" | grep -v "instrument." || true)
          if [ -n "$SECRET_MATCHES" ]; then
            echo "âŒ Found hardcoded default secrets!"
            echo "$SECRET_MATCHES"
            FOUND=1
          fi
          
          # Check for .env files in repo
          ENV_FILES=$(git ls-files | grep -E "\.env$|\.env\.(local|production|staging|produccion)$" 2>/dev/null || true)
          if [ -n "$ENV_FILES" ]; then
            echo "âŒ Found .env files committed!"
            echo "$ENV_FILES"
            FOUND=1
          fi
          
          if [ "$FOUND" -eq 1 ]; then
            echo "Security scan failed - remove hardcoded secrets before deploying"
            exit 1
          fi
          echo "âœ… No hardcoded secrets found"

      - name: Generate SBOM
        run: |
          cd backend
          npm ls --json --depth=0 2>/dev/null > ../sbom-backend.json || printf '{"type":"empty"}' > ../sbom-backend.json
          # Only generate Flutter SBOM if flutter is installed
          if command -v flutter &>/dev/null; then
            flutter pub deps --json 2>/dev/null > sbom-flutter.json || printf '{"type":"empty"}' > sbom-flutter.json
          else
            printf '{"type":"empty","note":"flutter not available in this job"}' > sbom-flutter.json
          fi

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-backend.json
            sbom-flutter.json
          retention-days: 90

  # ==========================================================================
  # PHASE 5a: BUILD ANDROID (Test Branch - Debug)
  # ==========================================================================
  build-android-debug:
    name: Build Android (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [flutter-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      apk_size: ${{ steps.size.outputs.size }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-path: ~/.pub-cache

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Flutter dependencies
        run: flutter pub get

      - name: Get Flutter packages cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Get Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs || true
        continue-on-error: true

      - name: Build APK debug
        id: build
        run: |
          flutter build apk --debug 2>&1
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK built: $APK_PATH"

      - name: APK size report
        id: size
        run: |
          SIZE=$(ls -lh build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null | awk '{print $5}')
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "APK Size: $SIZE"

      - name: Upload APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Upload CI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-artifacts-${{ github.sha }}
          path: /tmp/ci-artifacts/
          retention-days: 3
          if-no-files-found: ignore

      - name: Build summary
        run: |
          echo "## âœ… Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Android Debug APK" >> $GITHUB_STEP_SUMMARY
          echo "- Size: ${{ steps.size.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- Path: \`${{ steps.build.outputs.apk_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Quality Gates" >> $GITHUB_STEP_SUMMARY
          echo "- âœ… Lint: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- âœ… Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- âœ… Security: Passed" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # PHASE 5b: BUILD ANDROID (Main Branch - Release)
  # ==========================================================================
  build-android-release:
    name: Build Android (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [flutter-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      aab_path: ${{ steps.build.outputs.aab_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-path: ~/.pub-cache

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Flutter dependencies
        run: flutter pub get

      - name: Get Flutter packages cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Get Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs || true
        continue-on-error: true

      - name: Build APK & AAB release
        id: build
        run: |
          flutter build apk --release --split-per-abi 2>&1
          flutter build appbundle --release 2>&1
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          AAB_PATH=$(find build/app/outputs/bundle -name "*.aab" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT

      - name: Upload APKs & AABs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: APK size report
        run: |
          echo "## âœ… Release Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Sizes" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/flutter-apk/*.apk 2>/dev/null | awk '{print "- " $9 ": " $5}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundle" >> $GITHUB_STEP_SUMMARY
          ls -lh build/app/outputs/bundle/release/*.aab 2>/dev/null | awk '{print "- " $9 ": " $5}' >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # PHASE 6: SEMANTIC VERSIONING (Main Branch Only)
  # ==========================================================================
  version:
    name: Semantic Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-android-release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: android-release-${{ github.sha }}
          path: build/app/outputs

      - name: Get current version
        id: version
        run: |
          CURRENT=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Create git tag
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally"
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"
          echo "Created tag: $TAG"

      - name: Create release notes
        run: |
          echo "## Release ${{ steps.version.outputs.current }}" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Changes" >> release-notes.md
          git log --oneline -20 >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          tag_name: v${{ steps.version.outputs.current }}
          body_path: release-notes.md
          draft: false
          files: |
            build/app/outputs/**/*.apk
            build/app/outputs/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # CI ARTIFACTS: Upload structured diagnostic logs
  # ==========================================================================
  upload-artifacts:
    name: Upload CI Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [flutter-lint, backend-lint, backend-test, flutter-test]
    if: failure()
    steps:
      - name: Upload error logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-diagnostics-${{ github.sha }}
          path: /tmp/ci-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # FAILURE NOTIFICATION
  # ==========================================================================
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [preflight, flutter-lint, backend-lint, backend-test, flutter-test, security, build-android-debug, build-android-release]
    if: failure()
    steps:
      - name: Collect failure details
        id: details
        run: |
          echo "## âŒ CI/CD Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

      - name: Check Flutter lint
        run: |
          STATUS="${{ needs.flutter-lint.result }}"
          echo "| Flutter Lint | $STATUS |" >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" != "success" ]; then
            echo "| â†’ Errors | ${{ needs.flutter-lint.outputs.error_count || '?' }} |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Backend lint
        run: |
          STATUS="${{ needs.backend-lint.result }}"
          echo "| Backend Lint | $STATUS |" >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" != "success" ]; then
            echo "| â†’ Errors | ${{ needs.backend-lint.outputs.error_count || '?' }} |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check Backend tests
        run: |
          STATUS="${{ needs.backend-test.result }}"
          echo "| Backend Tests | $STATUS |" >> $GITHUB_STEP_SUMMARY

      - name: Check Flutter tests
        run: |
          STATUS="${{ needs.flutter-test.result }}"
          echo "| Flutter Tests | $STATUS |" >> $GITHUB_STEP_SUMMARY

      - name: Check Security
        run: |
          STATUS="${{ needs.security.result }}"
          echo "| Security Scan | $STATUS |" >> $GITHUB_STEP_SUMMARY

      - name: Failure links
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ðŸ”— Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [View Full Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ðŸ› ï¸ Quick Fix Commands" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Reproduce locally:" >> $GITHUB_STEP_SUMMARY
          echo "git pull && cd backend && npm ci && npm run test:ci" >> $GITHUB_STEP_SUMMARY
          echo "flutter analyze && flutter test" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_The [CI Self-Heal](${{ github.server_url }}/${{ github.repository }}/actions/workflows/ci-self-heal.yml) workflow may have automatically analyzed this failure._" >> $GITHUB_STEP_SUMMARY
