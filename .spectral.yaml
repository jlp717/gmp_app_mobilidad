# Spectral ruleset GMP: OAS base + reglas de proyecto (ADR-001)
extends: ["spectral:oas"]

rules:
  # Los componentes viven en ficheros modulares y quedan inlineados al compilar:
  # el chequeo de "unused" sobre el artefacto genera ruido.
  oas3-unused-component: off
  no-$ref-siblings: off
  operation-tag-defined: warn
  openapi-tags-alphabetical: off

# This retired operation deliberately returns 410. The OpenAPI contract test
# executes its real callback and requires the exception to stay this narrow.
# https://github.com/stoplightio/spectral/blob/develop/docs/guides/4d-overrides.md
overrides:
  - files:
      - "docs/openapi/openapi.yaml#/paths/~1pedidos~1confirm/post"
    rules:
      operation-success-response: off
