

name: gmp_app_mobilidad
description: "Ultimate Sales Analytics - Ultra-Modern Tablet App for Sales Directors & Representatives"
publish_to: 'none'
version: 4.1.21+77

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  collection: ^1.18.0
  connectivity_plus: ^7.1.1
  crypto: ^3.0.3
  cupertino_icons: ^1.0.6
  device_info_plus: ^12.4.0 # Device fingerprinting for audit
  dio: ^5.4.0
  equatable: ^2.0.5
  fl_chart: ^0.66.0
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  flutter_animate: ^4.5.0
  flutter_bluetooth_printer: ^2.2.0 # Raw ZPL over BT Classic (SPP/RFCOMM)
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^6.1.0
  flutter_pdfview: ^1.3.2 # In-app PDF viewer
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^10.2.0
  freezed_annotation: ^2.4.1
  geolocator: ^11.0.0
  get_it: ^9.2.1
  go_router: ^13.2.0
  google_fonts: ^6.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  image_picker: ^1.0.7
  injectable: ^2.3.2
  intl: any
  latlong2: ^0.9.1
  open_filex: ^4.3.2 # Open files natively
  package_info_plus: ^9.0.0
  path: ^1.8.3
  path_provider: ^2.1.2
  pdf: ^3.10.7 # PDF document generation
  permission_handler: ^12.0.1 # Runtime BT permissions Android 12+
  printing: ^5.11.1 # PDF preview/print support
  riverpod_annotation: ^2.3.5
  rxdart: ^0.28.0
  screenshot: ^3.0.0 # Canvas screenshot capture
  sentry_dio: ^8.14.2
  sentry_flutter: ^8.14.2
  share_plus: ^7.2.1 # Email/WhatsApp sharing
  shared_preferences: ^2.2.2
  signature: ^6.3.0 # Digital signature capture
  syncfusion_flutter_calendar: ^28.1.33
  syncfusion_flutter_charts: ^28.1.33
  timezone: ^0.10.0
  url_launcher: ^6.2.4
  webview_flutter: ^4.10.0
  workmanager: ^0.9.0+3

dev_dependencies:
  fake_async: ^1.3.3
  bloc_test: ^9.1.5
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  freezed: ^2.4.7
  hive_generator: ^2.0.1
  integration_test:
    sdk: flutter
  injectable_generator: ^2.4.2
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  mocktail: ^1.0.4
  riverpod_generator: ^2.4.0
  # Floor relaxed from ^1.26.2: that range cannot solve against current
  # stable flutter_test (test_api 0.7.12+) while hive_generator ^2.0.1 pins
  # analyzer <7 — `flutter pub get` failed on CI (flutter-tests, ago 28).
  # ^1.25.0 lets the solver pick 1.26.2 (committed lock) locally and a
  # compatible newer test on stable CI runners.
  test: ^1.25.0
  very_good_analysis: ^6.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21 # Support modern Android features

flutter:
  uses-material-design: true
  assets:
    - assets/load_planner/
    - assets/load_planner/lib/
    - assets/rutero_map/
    - assets/branding/ticket_header.png
