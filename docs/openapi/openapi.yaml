  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "JWT de acceso emitido por POST /auth/login."
    swaggerBasic:
      type: "http"
      scheme: "basic"
      description: "Basic Auth para documentación operativa protegida."
  schemas:
    Error:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: false
        error:
          type: "string"
          example: "Solicitud inválida"
        code:
          type: "string"
          example: "VALIDATION_ERROR"
        id:
          type: "string"
          example: "00000000-0000-4000-8000-000000000001"
      required:
        - "error"
      additionalProperties: true
    AuthLoginRequest:
      type: "object"
      properties:
        username:
          type: "string"
          maxLength: 50
          example: "R01"
        password:
          type: "string"
          format: "password"
          example: "0000"
      required:
        - "username"
        - "password"
      additionalProperties: false
    AuthLoginResponse:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: true
        user:
          type: "object"
          additionalProperties: true
          example:
            id: "TEST-USER"
            code: "R01"
            name: "Usuario ficticio"
        role:
          type: "string"
          example: "COMERCIAL"
        availableRoles:
          type: "array"
          items:
            type: "string"
          example:
            - "COMERCIAL"
        token:
          type: "string"
          example: "jwt-ficticio-no-valido"
        refreshToken:
          type: "string"
          example: "refresh-ficticio-no-valido"
        tokenExpiresIn:
          type: "integer"
          example: 900
        refreshExpiresIn:
          type: "integer"
          example: 604800
      required:
        - "success"
        - "user"
        - "role"
        - "token"
        - "refreshToken"
      additionalProperties: true
