version: 1
purpose: "OpenTelemetry gen_ai.* semantic convention mapping for AgentOps"

exporter:
  primary: "file"
  path: ".opencode/state/otel-genai.jsonl"
  # Live OTLP path is optional and fail-soft. No secrets required to enable.
  collector_otlp: "optional"
  otlp:
    enabled_when_env: "OTEL_EXPORTER_OTLP_ENDPOINT"
    protocol_env: "OTEL_EXPORTER_OTLP_PROTOCOL" # http/json (default) | http/protobuf
    headers_env: "OTEL_EXPORTER_OTLP_HEADERS" # optional key=value,key=value (Bearer tokens via env only)
    traces_path: "/v1/traces"
    fail_soft: true
    note: |
      Set OTEL_EXPORTER_OTLP_ENDPOINT to a collector base URL (e.g. http://127.0.0.1:4318).
      Plugin posts OTLP/HTTP JSON spans; if unset or POST fails, file exporter still works.
      Never commit collector credentials — use OTEL_EXPORTER_OTLP_HEADERS from local env/.env only.

spans:
  routing_decision:
    name: gen_ai.route
    attributes: [gen_ai.operation.name, gen_ai.request.model, gmp.tier, gmp.risk]
  tool_call:
    name: gen_ai.execute_tool
    attributes: [gen_ai.tool.name, gen_ai.tool.call.id, gmp.tool.args_digest]
  state_transition:
    name: gmp.workflow.transition
    attributes: [gmp.from_state, gmp.to_state, gmp.task_id, gmp.snapshot_key]
  agent_invocation:
    name: gen_ai.invoke_agent
    attributes: [gen_ai.agent.name, gen_ai.request.model, gmp.cost_usd_est]

metrics:
  - name: gmp.agent.cost_usd
    labels: [agent, task_id]
  - name: gmp.agent.latency_ms
    labels: [agent, phase]
  - name: gmp.session.error_rate
    labels: [agent]

alerts:
  latency_p50_ms: 60000
  latency_p99_ms: 300000
  error_rate_pct: 10
  cost_spike_usd_session: 5
  cost_hard_cap_usd: 25

bridge:
  existing_plugin: "flow-observability.ts"
  note: "Map FLOW_TRACE/TEAM_TRACE events to gen_ai.* in file exporter + optional OTLP/HTTP"
