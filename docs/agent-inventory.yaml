degrade_to_workflow:
  - agent: memory-cleaner
    status: completed
    workflow_owner: semantic-memory-pruner
    justification: |
      Mostly deterministic GC/prune; keep LLM only for semantic merge; prune path is workflow semantic-memory-pruner (delete tools denied on agent).
  - agent: Metrics-Observer
    status: completed
    workflow_owner: scripts/opencode-governance/cost-latency-threshold.mjs
    justification: |
      Collection/thresholding is workflow (cost-latency-threshold.mjs); agent should only interpret incidents.
  - agent: Release-Notifier
    status: completed
    workflow_owner: telegram-notify
    justification: |
      Templated Telegram notify is workflow (telegram-notify); agent only for narrative synthesis on complex releases.
