protocol_version: 1
last_loaded: "2026-08-13"
purpose: >
  Agent-Computer Interface de los nodos del grafo de auditoria
  Graph+Loop+Harness. No duplica tool-aci-registry.yaml (ACI de tools).
graph_id: gmp-audit-graph-v1
side_effects_policy: "Ningun nodo de auditoria muta lib/ ni backend de producto. Findings van al LEDGER."

nodes:
  - id: context_loader
    title: Context Loader
    current_agent: Context-Manager
    graph_status: cableado
    evidence: ".opencode/agents/Context-Manager.md carga learned.yaml+audit; nodo context_loader. chief-protocol step context_loader ANTES de optimize/route. Prompt Chief reordenado. edit:deny. Archivos tracked: ver gitignore. AUD-H-004 parcial hasta que git vea los .md."
    inputs:
      - ".opencode/rules/learned.yaml"
      - ".opencode/audit/AUDIT_STATE.yaml"
      - ".opencode/audit/LEDGER.yaml"
      - ".opencode/memory/project-state.md"
      - ".opencode/memory/user-corrections.jsonl"
      - ".opencode/AGENTS.md"
      - ".opencode/config/chief-protocol.yaml"
      - ".opencode/config/agent-graph.yaml"
    outputs:
      - context_packet
      - rules_in_force
      - equivalents_map
      - gaps_bootstrap
    side_effects:
      - "Solo lectura. edit:deny. NO escribe learned.yaml ni AUDIT_STATE/LEDGER."
      - "memory-formation escribe learned.yaml solo tras pregunta unica a Javier."
      - "No edita producto"
      - "No commitea"

  - id: orchestrator
    title: Orchestrator
    current_agent: chief-engineer-assistant
    graph_status: presente
    evidence: ".opencode/config/agent-graph.yaml nodes.chief-engineer-assistant; GMP-Orchestrator.md existe pero no es entrypoint V4"
    inputs:
      - context_packet
      - optimized_prompt
      - decision-router output
      - flow-policy-check (tool; fuente .opencode/config/flow-policy.yaml)
    outputs:
      - workstreams
      - required_agents
      - gates
      - stop_conditions
    side_effects:
      - "Abre handoff-ledger en .opencode/state/handoffs/"
      - "Actualiza .opencode/state/[task_id].json"
      - "No implementa codigo de producto"

  - id: coding
    title: Coding
    current_agent: "Node-Express-Specialist + Flutter-*-Specialist + code-autopilot"
    graph_status: cableado
    evidence: "Especialistas de codigo son nodos; critic separado (Check-Reviewer) via edges maker->critic->verifier"
    inputs:
      - plan
      - context_packet
      - learned.yaml coding_standards
    outputs:
      - diffs
      - tests
      - evidence_of_reuse
    side_effects:
      - "Puede editar lib/ y backend/ solo cuando Orchestrator lo autorice en fase de producto"
      - "Esta auditoria: lectura"

  - id: security
    title: Security
    current_agent: appsec-engineer
    graph_status: cableado
    evidence: "appsec-engineer es nodo; Security-Validator en layer2_hidden, invocado por edge"
    inputs:
      - diffs
      - routes
      - auth/DB2 write paths
    outputs:
      - security_verdict
      - secret_scan
      - threat_notes
    side_effects:
      - "GuardVibe / fallback scan; no PASS inventado"
      - "No muta produccion"

  - id: performance
    title: Performance
    current_agent: "Performance-Analyst + Flutter-Performance-Specialist"
    graph_status: cableado
    evidence: "Performance-Analyst y Flutter-Performance-Specialist promovidos a nodes"
    inputs:
      - endpoints
      - queries
      - rebuild/jank suspects
      - prometheus/KPI baselines
    outputs:
      - perf_findings
      - n_plus_one_report
      - budget_notes
    side_effects: "Solo lectura + metricas; no deploy"

  - id: design_motion
    title: Design Motion
    current_agent: Visual-Design-Specialist
    graph_status: cableado
    evidence: "Visual-Design-Specialist promovido a nodo design_motion; motion tokens en su prompt; no se creo agente hueco"
    inputs:
      - UI diffs
      - learned.yaml design_system
      - motion_tokens (duration/easing/reduced-motion)
      - app_colors.dart (producto; fase posterior)
    outputs:
      - visual_risks
      - motion_notes
      - motion_tokens
      - anti_ai_slop_verdict
    side_effects: "No rediseña UI en fase harness"

  - id: seo_a11y
    title: SEO A11y
    current_agent: Visual-Design-Specialist
    graph_status: cubierto_por_design_motion
    evidence: "CRIT-001: quality-a11y-route eliminado. A11y = Visual-Design + quality-rubric CAT-008 Flutter Semantics. No axe/HTML. No nodo fantasma."
    inputs:
      - UI tree
      - semantics
      - contrast/focus
    outputs:
      - a11y_verdict
      - seo_notes (N/A movil nativo salvo store metadata)
    side_effects: "Ninguno en harness"

  - id: infra
    title: Infra
    current_agent: sre-engineer
    graph_status: cableado
    evidence: "sre-engineer nodo; DevOps/Runtime-Log en on_demand; deploy whitelist en learned.yaml + flow-policy.yaml + production-safety.yaml"
    inputs:
      - runtime-health.yaml
      - learned.yaml deploy
      - SSH/PM2 facts
    outputs:
      - health_verdict
      - deploy_command_allowlist_check
    side_effects:
      - "Prohibido cualquier deploy fuera de git pull origin test + pm2 restart gmp-api sin confirmacion explicita"

  - id: critic
    title: Critic
    current_agent: "business-critic + truth-teller + Check-Reviewer"
    graph_status: cableado
    evidence: "business-critic, truth-teller y Check-Reviewer son nodos; edges maker->critic->verifier"
    inputs:
      - plan
      - findings
      - business claims
    outputs:
      - adversarial_review
      - false_claim_flags
    side_effects: "No confirma por default; no muta codigo"

  - id: verifier
    title: Verifier
    current_agent: Technical-Verifier
    graph_status: cableado
    evidence: "Technical-Verifier nodo; verification-loop + loop-gate atados a .opencode/audit/LEDGER.yaml; max 3"
    inputs:
      - specialist_output
      - evidence_schema
      - quality-rubric.yaml
    outputs:
      - PASS | WARN | BLOCK
      - evidence_packet
    side_effects: "Rechaza entregas sin evidencia; no implementa"

  - id: learning_capture
    title: Learning Capture
    current_agent: memory-formation
    graph_status: cableado
    evidence: "memory-formation es nodo; capture_protocol learned.yaml; escribe learned.yaml solo tras si de Javier"
    inputs:
      - correcciones de Javier
      - LEDGER findings repetidos
      - same-error-tracker.jsonl
    outputs:
      - user-corrections.jsonl records
      - propuesta de promocion a learned.yaml (pregunta unica)
    side_effects:
      - "Escribe .opencode/memory/*"
      - "Solo escribe learned.yaml tras si explicito de Javier"
