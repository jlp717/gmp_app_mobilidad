protocol_version: 1
last_loaded: "2026-08-13"
canonical_path: ".opencode/rules/learned.yaml"
purpose: >
  Reglas permanentes confirmadas por Javier. No es el log de correcciones
  ni el catalogo de gates deterministicos. Context Loader debe leer este
  archivo en cada sesion de auditoria o implementacion.

capture_protocol:
  owner: Context Loader / memory-formation
  rule: >
    Si Javier dicta una correccion, preguntar UNA vez:
    "¿Promover esta correccion a regla permanente en learned.yaml?"
    Si dice si -> anadir aqui con origen, fecha y estado permanente.
    Si dice no o no responde -> quedar solo en user-corrections.jsonl.
  do_not: "Promover en silencio. No inventar reglas. No duplicar rules.json."
  after_three_repeats_legacy: >
    learning-loop.yaml ya propone actualizar rules.json a la tercera
    repeticion. Ese flujo no sustituye la pregunta unica de promocion
    a learned.yaml.

do_not_duplicate:
  - path: ".opencode/config/learning-loop.yaml"
    role: "Protocolo de captura (triggers, jsonl). No es reglas permanentes."
  - path: ".opencode/memory/user-corrections.jsonl"
    role: "Log de correcciones. Fuente de promocion, no canon permanente."
  - path: ".opencode/memory/user-corrections.md"
    role: "Vista humana del log de correcciones."
  - path: ".opencode/rules.json"
    role: "Gates deterministicos S/D/ARQ/SEN/Q/E. Distinto de este archivo."
  - path: ".opencode/config/governance/tool-aci-registry.yaml"
    role: "ACI de tools. El ACI de nodos de auditoria vive en .opencode/audit/ACI.yaml."
  - path: ".opencode/config/harness-engineering.yaml"
    role: "Harness general del equipo (DISCOVER-PLAN-EXECUTE-VERIFY)."
  - path: ".opencode/harness/"
    role: "feature-list.json + progress.jsonl de sesiones de codigo, no ledger de auditoria."
  - path: ".opencode/state/handoffs/"
    role: "handoff-ledger de especialistas. No es .opencode/audit/LEDGER.yaml."
  - path: ".agent/nhallucinate/lessons-learned.md"
    role: "Lecciones cortas de sesion. Complemento, no reemplazo."

load_order:
  - ".opencode/memory/FIELD-GUIDE.md"
  - "vault/09-index/index.md"
  - ".opencode/rules/learned.yaml"
  - ".opencode/memory/user-corrections.jsonl"
  - ".opencode/rules.json"

deploy:
  - regla: >
      Para subir a servidor: unicamente 'git pull origin test' seguido de
      'pm2 restart gmp-api'. Ningun otro comando de deploy sin confirmacion
      explicita mia.
    origen: "Instruccion directa 2026-08-13"
    evidencias:
      - ".opencode/memory/user-corrections.md#fa3607fc094c9072"
      - "docs/releases/repartidor-demo-certification-mandatory-addendum-2026-08-11.md"
    estado: permanente
  - regla: >
      La autorizacion de git pull origin test + pm2 restart gmp-api no
      autoriza editar .env ni ejecutar pm2 set/save/start/reload. Lectura
      de logs y comandos que no mutan la app siguen permitidos.
    origen: "Addendum certificacion repartidor 2026-08-11 + correccion 2026-06-13"
    estado: permanente

coding_standards:
  - regla: "Cero hardcodeos. Todo valor de configuracion va a env/config layer."
    origen: "Instruccion directa 2026-08-13"
    evidencias:
      - ".opencode/QUALITY-GATES.md"
      - ".opencode/config/elite-quality-gate.yaml#hardcode_detection"
    estado: permanente
  - regla: "Criterio senior por defecto: mantenible, escalable, seguro, performante — sin que se pida cada vez."
    origen: "Instruccion directa 2026-08-13"
    evidencias:
      - ".opencode/memory/user-corrections.md (REGLA PERMANENTE DEL EQUIPO 2026-08-12)"
      - ".opencode/rules.json#SEN01"
    estado: permanente

design_system:
  - regla: "Sin auto-ejecucion, sin gamificacion, sin estetica generica de IA, sin emojis en UI."
    origen: "Constitucion de producto PrΘxenos"
    nota: "No hay fichero local de constitucion Proxenos en este repo a 2026-08-13. SEN04 cubre estetica generica de IA."
    evidencias:
      - ".opencode/rules.json#SEN04"
    estado: permanente

orchestration:
  - regla: >
      El grafo no puede tener edges huerfanos. Cada destino de edge
      debe estar en nodes, layer2_hidden.agents o on_demand.agents.
    origen: "Adelante A+B+C config equipo 2026-08-13"
    estado: permanente
  - regla: >
      El que escribe nunca se autoevalua. Secuencia maker ->
      Check-Reviewer (diff limpio) -> Technical-Verifier.
      business-critic y truth-teller son on_demand, no el critic por defecto.
    origen: "Adelante A+B+C config equipo 2026-08-13; V5 2026-08-15"
    estado: permanente
  - regla: >
      El modelo nunca ve passwords ni tokens. Solo credentials_ref y MCP.
      Si un secreto toco texto plano (chat, md, log), rotarlo.
    origen: "Arquitectura de referencia secretos 2026-08-15"
    estado: permanente
  - regla: >
      Context Loader carga Field Guide y vault/09-index. Maximo 3 notas wiki.
      Prohibido volcar AGENTS.md + AUDIT_STATE + LEDGER + ACI en cada turno.
    origen: "V5 playbook orchestra 2026-08-15"
    estado: permanente
  - regla: >
      Chief posee la conversacion. Especialistas son tools, no handoff al usuario.
      Research: 3-5 Web-Researcher en paralelo + citation pass. Coding: 1 writer.
      Brief: objective, output_format, tools, stop_when, not_your_job.
      A2A no adoptado. Sesion = log append-only, no la ventana de contexto.
    origen: "V6 Anthropic/OpenAI/NVIDIA public patterns 2026-08-17"
    estado: permanente
  - regla: >
      Planner siempre openai/gpt-5.6-sol. Executor terra solo con spec EARS
      clara y riesgo bajo. Nunca terra en SECURE, PROD BD/secretos/deploy,
      migracion DB2 ni comisiones/objetivos/Proxenos. Critic nunca mas barato
      que el maker. Fases en task-playbooks.yaml; gate no verificable no es gate.
      Factory: loop hasta product-delivery-contract PASS. PR != produccion.
    origen: "V6 cost policy + phased playbooks + factory 2026-08-17"
    estado: permanente
  - regla: >
      YAML de .opencode/config debe parsear con yaml.safe_load.
      flow-policy.yaml es la fuente canonica; flow-policy-check.ts la enforce.
    origen: "Adelante A+B+C config equipo 2026-08-13"
    estado: permanente
  - regla: >
      No crear agente de ceremonia. Un nodo extra solo si aporta
      especialidad que el anterior no cubre. A11y Flutter lo cubre
      Visual-Design-Specialist + quality-rubric CAT-008 (Semantics).
      No hay quality-a11y-route ni agente SEO vacio.
    origen: "Adelante A+B+C config equipo 2026-08-13; CRIT-001 2026-08-13"
    estado: permanente
