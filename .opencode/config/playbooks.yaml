version: 6
enabled: true
purpose: >
  Orquestacion V6 = V5 + patrones publicos de Anthropic/OpenAI/NVIDIA.
  Javier habla al Chief (manager). Especialistas son tools. Sesion durable.
source:
  field_guide: ".opencode/memory/FIELD-GUIDE.md"
  quality: ".opencode/config/code-quality-contract.yaml"
  graph_index: "vault/09-index/index.md"
  capabilities: ".opencode/config/capability-catalog.yaml"
  agency: ".opencode/config/agency-capability-map.yaml"
  guardrails: ".opencode/config/guardrails.yaml"
  delegation: ".opencode/config/delegation-contract.yaml"
  session: ".opencode/config/session.yaml"

standing_roster:
  - chief-engineer-assistant
  - Context-Manager
  - Repo-Explorer
  - Architect-Planner
  - maker
  - Check-Reviewer
  - Technical-Verifier
  - qa-automation-lead
  - appsec-engineer
  - sre-engineer
  - DB2-AS400-Specialist
  - product-ux

rules:
  - "Scale effort to complexity. TINY no spawnea equipo."
  - "Writes single-threaded salvo SWEEP con worktrees y ficheros disjuntos."
  - "Critic recibe diff limpio. No hereda el plan del maker."
  - "Skills cargan conocimiento. No crear agente por especialidad de prompt."
  - "Agencia: departments[] del router. Always-on quality/QA/a11y baseline en BUILD. Javier no lo pide."
  - "Contexto progresivo: Field Guide, luego indice vault, luego 1-3 notas."
  - "Cierre con codigo: code-quality-contract PASS o BLOCK honesto."
  - "Plan persistido ANTES de delegar. Sobrevive a truncado de contexto."
  - "El modelo nunca ve credenciales. Solo credentials_ref + MCP."
  - "Subagente devuelve sintesis condensada, no el contexto de busqueda."
  - "Manager pattern (OpenAI): el Chief no cede la conversacion. Workers = tools."
  - "Research: 3-5 workers en paralelo + citation pass. No 10+ en coding."
  - "Delegation contract: objective, output_format, tools, stop_when, not_your_job."

playbooks:
  tiny:
    when: "1 archivo, typo, rename, pregunta, correccion, saludo"
    writers: 1
    agents: [Context-Manager]
    optional_writer: maker
    gates: []
    quality_contract: "si hay diff, elite-quality-gate sobre esos files"
    max_turns: 8
  explore:
    when: "mapear, auditar, localizar, investigar, logs readonly, documentacion oficial"
    writers: 0
    agents: [Context-Manager, Repo-Explorer]
    add_if:
      db2: [DB2-AS400-Specialist]
      prod: [sre-engineer]
      research: [Web-Researcher, Technical-Verifier]
    parallel_research:
      workers: 3
      tools_each_min: 3
      citation_agent: Technical-Verifier
    pattern: orchestrator_workers
    gates: [read-files-before-edit]
    max_turns: 20
  build:
    when: "feature, bugfix, pantalla, endpoint, refactor acotado"
    writers: 1
    agents: [Context-Manager, maker, Check-Reviewer, qa-automation-lead]
    add_if:
      t3: [Architect-Planner, Technical-Verifier, product-ux]
      db2: [DB2-AS400-Specialist]
      ui: [product-ux]
    gates: [plan-approval-before-code, spec-ears-before-code, critic-before-verify, code-quality-contract, qa-pass]
    spec: "task-playbooks.yaml: spec_ears -> maker -> gates verificables -> critic_diff. Factory: product-delivery-contract + PR. No saltar fase."
    max_turns: 40
    skills_into_maker:
      - node-backend-patterns
      - gmp-mobilidad-flutter
      - flutter-riverpod-gmp
      - db2-query-patterns
      - ponytail
      - greenfield-pipeline
      - openspec-explore
  sweep:
    when: "migracion, directorio, 50+ files, rename masivo, ESM, capas"
    writers: n_isolated
    agents: [Context-Manager, Architect-Planner, maker, Check-Reviewer, Technical-Verifier, qa-automation-lead]
    isolation: git_worktrees
    rule: "1 owner por fichero. Planner no implementa. Merge imparcial si conflicto."
    gates: [plan-approval-before-code, critic-before-verify, code-quality-contract]
    max_turns: 50
  secure:
    when: "vulnerabilidad, XSS, SQL injection, secretos, auth, OWASP"
    writers: 1
    agents: [Context-Manager, Repo-Explorer, maker, appsec-engineer, Check-Reviewer]
    rule: "AppSec no escribe el parche que audita. Contexto limpio sobre el diff."
    gates: [appsec-pass, code-quality-contract, sql-parameterization]
    max_turns: 30
  prod:
    when: "deploy, pm2, rollback, DB2 DDL/DML, .env, secret rotation"
    writers: 1
    agents: [Context-Manager, sre-engineer]
    add_if:
      db2: [DB2-AS400-Specialist]
    gates:
      - staging-first
      - qa-pass
      - appsec-pass
      - sre-health-60s
      - production-approval-token
    deploy_whitelist:
      - "git pull origin test"
      - "pm2 restart gmp-api"
    forbidden_without_javier:
      - "pm2 set"
      - "pm2 save"
      - "pm2 start"
      - "pm2 reload"
      - "edit .env"
    max_turns: 15
