version: 1
enabled: true
purpose: >
  El modelo nunca ve credenciales. Patron Anthropic Managed Agents:
  cerebro (LLM + harness) separado de las manos (MCP/proxy/vault).
storage: env_or_vault
resolution: harness_runtime_only
pre_commit_gate: gitleaks
rotate_if_touched_plaintext: true

never_in:
  - system prompts
  - agent md
  - FIELD-GUIDE
  - vault notes
  - decision-route JSON
  - handoff-ledger
  - git

allowed_in_context:
  - resource names
  - credentials_ref placeholders
  - domain knowledge (VISTA_DEUDA_BASE, ROW_NUMBER on CPC, R1_T8CDVD)

connections_source: ".opencode/config/connections.yaml"

detect_in_diff:
  - '(password|passwd|pwd|secret|api[_-]?key|token)\\s*[:=]\\s*[''"`][^''"`]{6,}'
  - 'BEGIN (RSA |OPENSSH |PRIVATE )'
  - 'AKIA[0-9A-Z]{16}'

on_hit: BLOCK
repair: "Quitar literal. Usar credentials_ref. Rotar el secreto. No reescribir el valor en el chat."
