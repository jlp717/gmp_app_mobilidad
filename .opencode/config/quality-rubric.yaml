version: 2
enabled: true
purpose: Quality rubric for GMP App Mobilidad verification-driven development.
severity_definitions:
  critical: Blocks delivery immediately.
  high: Blocks delivery unless Chief documents risk acceptance.
  medium: Warning with remediation plan.
  low: Advisory track as debt.
categories:
  correctness:
    id: CAT-001
    description: Code compiles type checks lint clean builds.
    weight: 10
    criteria:
    - id: COR-001
      description: Zero type errors
      verification_method: dart analyze / tsc
      threshold:
        pass: '0'
        warn: '0'
        block: '> 0'
      severity: critical
      evidence_required: true
    - id: COR-002
      description: Zero lint errors
      verification_method: flutter analyze / eslint
      threshold:
        pass: '0'
        warn: '0'
        block: '> 0'
      severity: critical
      evidence_required: true
    - id: COR-003
      description: Build succeeds
      verification_method: flutter build apk / npm run build
      threshold:
        pass: exit 0
        warn: exit 0 with warnings
        block: exit != 0
      severity: critical
      evidence_required: true
    - id: COR-004
      description: No uncaught runtime exceptions on critical paths
      verification_method: integration_test / playwright
      threshold:
        pass: '0'
        warn: 0 uncaught
        block: '> 0 uncaught'
      severity: critical
      evidence_required: true
  security:
    id: CAT-002
    description: No critical/high SAST no secrets OWASP enforced.
    weight: 10
    criteria:
    - id: SEC-001
      description: Zero critical/high SAST findings
      verification_method: guardvibe
      threshold:
        pass: '0'
        warn: '> 0 medium'
        block: '> 0 critical/high'
      severity: critical
      evidence_required: true
    - id: SEC-002
      description: Zero hardcoded secrets in source
      verification_method: guardvibe + rg
      threshold:
        pass: '0'
        warn: '0'
        block: '> 0'
      severity: critical
      evidence_required: true
    - id: SEC-003
      description: All DB2 queries parameterized
      verification_method: rg + ast
      threshold:
        pass: '0'
        warn: '0'
        block: '> 0'
      severity: critical
      evidence_required: true
    - id: SEC-004
      description: Auth check before DB access
      verification_method: ast_pattern
      threshold:
        pass: '0'
        warn: '0'
        block: '> 0'
      severity: critical
      evidence_required: true
    - id: SEC-005
      description: POST/PUT have input validation
      verification_method: ast_pattern
      threshold:
        pass: '0'
        warn: '0'
        block: '> 0'
      severity: high
      evidence_required: true
    - id: SEC-006
      description: Security headers present
      verification_method: ast_pattern
      threshold:
        pass: all 4
        warn: 1-2 missing
        block: '> 2 missing'
      severity: medium
      evidence_required: true
  performance:
    id: CAT-003
    description: No N+1 no async loops bundle controlled.
    weight: 8
    criteria:
    - id: PERF-001
      description: Zero N+1 patterns
      verification_method: ast_runtime + elite-quality-gate
      threshold:
        pass: '0'
        warn: '0'
        block: '> 0'
      severity: critical
      evidence_required: true
    - id: PERF-002
      description: Zero async loop anti-patterns
      verification_method: ast + rg
      threshold:
        pass: '0'
        warn: '0'
        block: '> 0'
      severity: critical
      evidence_required: true
    - id: PERF-003
      description: DB2 list endpoints paginated + ordered
      verification_method: ast_pattern
      threshold:
        pass: all
        warn: partial
        block: any missing
      severity: high
      evidence_required: true
    - id: PERF-004
      description: DB2 list endpoints use batch/prefetch
      verification_method: ast_pattern
      threshold:
        pass: all
        warn: some
        block: documented N+1
      severity: high
      evidence_required: true
    - id: PERF-005
      description: Bundle size < 50MB
      verification_method: flutter build --analyze-size
      threshold:
        pass: < 50
        warn: 50-100
        block: '> 100'
      severity: medium
      evidence_required: true
    - id: PERF-006
      description: API p95 < 500ms
      verification_method: k6 / prometheus
      threshold:
        pass: < 500
        warn: 500-2000
        block: '> 2000'
      severity: medium
      evidence_required: true
  maintainability:
    id: CAT-004
    description: Duplication file length complexity limits.
    weight: 6
    criteria:
    - id: MAIN-001
      description: Duplication < 3pct
      verification_method: code-reuse-detector
      threshold:
        pass: < 3
        warn: 3-5
        block: '> 5'
      severity: medium
      evidence_required: true
    - id: MAIN-002
      description: No file > 1800 lines
      verification_method: wc -l
      threshold:
        pass: <= 1800
        warn: '> 1800 with plan'
        block: '> 1800 no plan'
      severity: medium
      evidence_required: true
    - id: MAIN-003
      description: Function complexity <= 10
      verification_method: ast_metrics
      threshold:
        pass: <= 10
        warn: 11-15
        block: '> 15'
      severity: medium
      evidence_required: true
    - id: MAIN-004
      description: File complexity <= 20
      verification_method: ast_metrics
      threshold:
        pass: <= 20
        warn: 21-30
        block: '> 30'
      severity: medium
      evidence_required: true
    - id: MAIN-005
      description: Coupling <= 5
      verification_method: import graph
      threshold:
        pass: <= 5
        warn: 6-8
        block: '> 8'
      severity: medium
      evidence_required: true
  testing:
    id: CAT-005
    description: Coverage mutation score test quality.
    weight: 8
    criteria:
    - id: TEST-001
      description: Diff coverage >= 80pct critical paths
      verification_method: flutter_test_coverage / jest
      threshold:
        pass: '>= 80'
        warn: 70-79
        block: < 70
      severity: critical
      evidence_required: true
    - id: TEST-002
      description: New business logic has tests
      verification_method: code-reuse-detector
      threshold:
        pass: all covered
        warn: N/A
        block: 0 tests
      severity: critical
      evidence_required: true
    - id: TEST-003
      description: Mutation score >= 60pct
      verification_method: mutation-test-gate
      threshold:
        pass: '>= 60'
        warn: 50-59
        block: < 50
      severity: high
      evidence_required: true
    - id: TEST-004
      description: Integration tests for auth + DB2 writes
      verification_method: integration_test
      threshold:
        pass: all
        warn: partial
        block: none
      severity: high
      evidence_required: true
    - id: TEST-005
      description: E2E for top 5 journeys
      verification_method: playwright
      threshold:
        pass: '5'
        warn: 3-4
        block: < 3
      severity: medium
      evidence_required: true
    - id: TEST-006
      description: Regression tests pass
      verification_method: test suite
      threshold:
        pass: all pass
        warn: known failures
        block: unexpected
      severity: critical
      evidence_required: true
  architecture:
    id: CAT-006
    description: Layer boundaries no scope escape import rules.
    weight: 9
    criteria:
    - id: ARCH-001
      description: Zero scope escapes
      verification_method: scope-creep-detector
      threshold:
        pass: '0'
        warn: '0'
        block: '> 0'
      severity: critical
      evidence_required: true
    - id: ARCH-002
      description: Zero layer violations
      verification_method: scope-creep-detector
      threshold:
        pass: '0'
        warn: '0'
        block: '> 0'
      severity: critical
      evidence_required: true
    - id: ARCH-003
      description: Flutter files under standard layers
      verification_method: directory audit
      threshold:
        pass: all
        warn: minor
        block: systematic
      severity: medium
      evidence_required: true
    - id: ARCH-004
      description: Backend routes/services/repos separated
      verification_method: architecture audit
      threshold:
        pass: all
        warn: minor
        block: systematic
      severity: medium
      evidence_required: true
    - id: ARCH-005
      description: No circular dependencies
      verification_method: import graph
      threshold:
        pass: '0'
        warn: '0'
        block: '> 0'
      severity: high
      evidence_required: true
    - id: ARCH-006
      description: Ponytail markers present
      verification_method: rg
      threshold:
        pass: all marked
        warn: unmarked safe
        block: unmarked ceiling
      severity: low
      evidence_required: true
  documentation:
    id: CAT-007
    description: API docs changelog audit trail.
    weight: 4
    criteria:
    - id: DOC-001
      description: API changes documented
      verification_method: changelog audit
      threshold:
        pass: all
        warn: minor
        block: breaking
      severity: medium
      evidence_required: true
    - id: DOC-002
      description: ADRs for significant decisions
      verification_method: ADR audit
      threshold:
        pass: all
        warn: minor
        block: major
      severity: medium
      evidence_required: true
    - id: DOC-003
      description: TEAM_TRACE audit trail
      verification_method: TEAM_TRACE audit
      threshold:
        pass: all
        warn: < 24h gap
        block: '> 24h gap'
      severity: low
      evidence_required: true
    - id: DOC-004
      description: Runbooks updated
      verification_method: runbook audit
      threshold:
        pass: all
        warn: minor
        block: critical
      severity: medium
      evidence_required: true
  accessibility:
    id: CAT-008
    description: Flutter Semantics (no axe/HTML). Owner Visual-Design-Specialist.
    weight: 5
    invoked_by: Visual-Design-Specialist
    criteria:
    - id: A11Y-001
      description: Semantics/ExcludeSemantics, tooltip, focus, contrast en tema
      verification_method: Visual-Design-Specialist + rg Semantics en diffs Flutter
      threshold:
        pass: interactive widgets have Semantics or equivalent
        warn: missing tooltip/focus on secondary controls
        block: interactive control without Semantics and without ExcludeSemantics
      severity: high
      evidence_required: true
integrations:
  verification_loop: .opencode/config/verification-loop.yaml
  elite_quality_gate: .opencode/config/elite-quality-gate.yaml
  handoff_contract: .opencode/config/handoff-contract.yaml
tools:
  sast: guardvibe
  ast_analysis: typescript-eslint / dart_analyzer / serena_mcp
  grep: rg
  coverage: flutter_test_coverage / jest_coverage
  mutation: mutation-test-gate
  scope_detection: scope-creep-detector
  reuse_detection: code-reuse-detector
  load_test: k6
  accessibility: "Visual-Design-Specialist Flutter Semantics"
enforcement:
  ci_modes:
    pre_commit:
      categories:
      - correctness
      - security
      fail_on_warn: false
      timeout_seconds: 30
    pre_merge:
      categories:
      - correctness
      - security
      - performance
      - maintainability
      - testing
      - architecture
      fail_on_warn: false
      timeout_seconds: 300
    pre_production:
      categories:
      - correctness
      - security
      - performance
      - maintainability
      - testing
      - architecture
      - documentation
      fail_on_warn: true
      timeout_seconds: 600
  override_policy:
    critical: Chief + SRE/AppSec sign-off with TTL
    high: Chief sign-off with TTL
    medium: Chief notification + remediation plan
    low: Tracked as debt
metadata:
  created: '2026-08-10'
  last_updated: '2026-08-10'
  owner: verification-loop / chief-engineer-assistant
  sso_ttl: true
