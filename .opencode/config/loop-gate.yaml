loop_gate:
  version: 1
  enabled: true
  script: "C:/Users/Javier/.codex/skills/loop-engineering/loop_gate.py"
  apply_at: "cierre de cada iteracion (goal-loop-manager tick)"
  audit_ledger: ".opencode/audit/LEDGER.yaml"
  verdicts:
    - PASS: "evidencia real de tests/checks aplicables y verificador independiente"
