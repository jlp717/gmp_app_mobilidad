    max_repair_iterations: 3
    max_no_progress_rounds: 2
  rules:
    - "Nunca afirmar tests/QA/seguridad/perf/accessibility/staging/rollback sin haberlos obtenido"
    - "Secretos, auth, DB2 writes, produccion, deploy, push, worktree delete y rollback destructivo: aprobacion humana fresca"
