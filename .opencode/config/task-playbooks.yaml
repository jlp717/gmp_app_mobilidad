version: 2
purpose: >
  Fases con gate por tipo de tarea. No "maker → critic" generico.
  Cada gate es boolean/numerico. Si no es verificable, no es gate.
  Escritorios de agencia: .opencode/config/agency-capability-map.yaml
  El router adjunta departments[]. Javier no nombra la disciplina.
source: ".opencode/config/capability-catalog.yaml#cost_policy"
agency_map: ".opencode/config/agency-capability-map.yaml"
always_on_departments: [quality, architecture, qa, security_baseline, git]
aliases:
  sol: openai/gpt-5.6-sol
  terra: openai/gpt-5.6-terra
planner_model: sol

template:
  task_type: "<nombre>"
  trigger_keywords: ["..."]
  planner_model: sol
  phases:
    - name: "<fase>"
      executor_model: "<sol|terra>"
      tools: ["..."]
      gate:
        blocking: true
        pass_criteria: "<umbral verificable>"
      on_fail: "reintenta | escala a sol | detiene y pide humano"

playbooks:
  frontend_flutter:
    task_type: frontend_flutter
    trigger_keywords: ["pantalla", "componente", "widget", "UI", "tab", "Flutter", "diseño", "repartidor"]
    surface: flutter
    planner_model: sol
    executor_cheap_if: "spec EARS clara y flujo no es cobros/facturas/pedidos/comisiones"
    phases:
      - name: spec_ears
        description: "Criterios de aceptacion verificables antes de tocar codigo"
        executor_model: sol
        agent: Architect-Planner
        tools: ["openspec-explore"]
        gate:
          blocking: true
          id: ears-criteria-verifiable
          pass_criteria: "cada criterio tiene forma 'Cuando [evento], el sistema debe [respuesta verificable]'"
        on_fail: "detiene y pide humano si el evento o la respuesta no son medibles"
      - name: maker
        description: "Implementacion contra spec y AppColors"
        executor_model: terra
        agent: maker
        tools: ["read", "edit", "gmp-mobilidad-flutter", "flutter-riverpod-gmp"]
        gate:
          blocking: true
          id: design-tokens-or-appcolors
          pass_criteria: "0 hex/colores fuera de AppColors; 0 Spacing magico; Semantics en interactivos"
        on_fail: "reintenta"
      - name: verificacion_visual
        description: "Comprobacion real de UI, no solo lectura de codigo"
        executor_model: terra
        agent: qa-automation-lead
        tools: ["flutter test", "golden/widget test", "Semantics tree"]
        gate:
          blocking: true
          id: visual-browser-or-golden
          pass_criteria: "widget/golden o integration test del flujo en verde; interactivos alcanzables via Semantics"
        on_fail: "reintenta; maker recibe el fallo del test, no una descripcion vaga"
        nota: >
          Arbol Semantics para navegacion/interaccion. Golden/screenshot solo para
          alineacion, espaciado y contraste percibido. No exigir Lighthouse en Flutter.
      - name: correccion_sistema
        description: "El sistema funciona y es accesible, no solo se ve bien"
        executor_model: terra
        agent: qa-automation-lead
        tools: ["flutter test", "flutter analyze", "Semantics"]
        gate:
          blocking: true
          id: system-tests-and-a11y
          pass_criteria: "flutter test del flujo en verde; flutter analyze 0 errores nuevos; 0 interactivos sin Semantics"
        on_fail: "reintenta"
      - name: optimizacion
        description: "Presupuestos de rendimiento reales"
        executor_model: terra
        agent: maker
        tools: ["flutter-riverpod-gmp", "performance-optimization"]
        gate:
          blocking: true
          id: web-vitals-or-flutter-perf
          pass_criteria: "0 N+1 en listas; providers tocados usan select(); 0 trabajo pesado en build()"
        on_fail: "no cerrar; maker recibe el hallazgo concreto"
      - name: critic_diff
        description: "Revision del diff contra la spec EARS original"
        executor_model: sol
        agent: Check-Reviewer
        tools: ["elite-quality-gate", "code-quality-contract", "git diff"]
        gate:
          blocking: true
          id: critic-ears-evidence
          pass_criteria: "cada criterio EARS tiene evidencia (test, analyze, golden) citada por file:line"
        on_fail: "escala a sol y reintenta una vez; luego detiene"

  frontend_web:
    task_type: frontend_web
    trigger_keywords: ["landing", "nextjs", "next.js", "página", "frontend web", "greenfield", "desde cero"]
    surface: web
    planner_model: sol
    phases:
      - name: spec_ears
        executor_model: sol
        agent: Architect-Planner
        tools: ["openspec-explore"]
        gate:
          blocking: true
          id: ears-criteria-verifiable
          pass_criteria: "cada criterio tiene forma 'Cuando [evento], el sistema debe [respuesta verificable]'"
        on_fail: "detiene y pide humano"
      - name: maker
        executor_model: terra
        agent: maker
        tools: ["read", "edit", "frontend-ui-engineering", "greenfield-pipeline"]
        gate:
          blocking: true
          id: design-tokens-or-appcolors
          pass_criteria: "0 valores de color/espaciado fuera del sistema de tokens"
        on_fail: "reintenta"
      - name: verificacion_visual_navegador
        executor_model: terra
        agent: qa-automation-lead
        tools: ["playwright accessibility snapshot", "playwright screenshot / toHaveScreenshot"]
        gate:
          blocking: true
          id: visual-browser-or-golden
          pass_criteria: "0 diffs de regresion visual sin revisar; flujo critico navegable via snapshot de accesibilidad"
        on_fail: "reintenta"
        nota: >
          Arbol de accesibilidad para la mayoria de pasos. Screenshot real solo para
          alineacion, espaciado y contraste percibido.
      - name: correccion_sistema
        executor_model: terra
        agent: qa-automation-lead
        tools: ["test_runner", "axe-core WCAG 2.2 AA", "chrome_devtools consola"]
        gate:
          blocking: true
          id: system-tests-and-a11y
          pass_criteria: "suite en verde; 0 violaciones axe-core serio/critico; 0 errores de consola nuevos"
        on_fail: "reintenta"
      - name: optimizacion_web
        executor_model: terra
        agent: maker
        tools: ["lighthouse_ci"]
        gate:
          blocking: true
          id: web-vitals-or-flutter-perf
          pass_criteria: "LCP < 2.5s, INP < 200ms, CLS < 0.1; sin regresion de bundle frente a ultima build verde"
        on_fail: "no mergear; maker recibe el reporte Lighthouse"
      - name: critic_diff
        executor_model: sol
        agent: Check-Reviewer
        tools: ["elite-quality-gate", "code-quality-contract"]
        gate:
          blocking: true
          id: critic-ears-evidence
          pass_criteria: "cada criterio EARS tiene evidencia (test, screenshot, metrica) citada por linea"
        on_fail: "escala a sol"

  backend:
    task_type: backend
    trigger_keywords: ["endpoint", "API", "route", "express", "backend"]
    planner_model: sol
    phases:
      - name: spec_ears
        executor_model: sol
        agent: Architect-Planner
        gate:
          blocking: true
          id: ears-criteria-verifiable
          pass_criteria: "cada criterio EARS es verificable (status, payload, error tipado)"
        on_fail: "detiene y pide humano"
      - name: maker
        executor_model: terra
        agent: maker
        tools: ["node-backend-patterns"]
        gate:
          blocking: true
          id: credentials-ref-only
          pass_criteria: "endpoints usan credentials_ref / MCP; 0 credencial literal; SQL parametrizado"
        on_fail: "reintenta"
      - name: tests_contrato
        executor_model: terra
        agent: qa-automation-lead
        tools: ["npx jest", "schema_validator"]
        gate:
          blocking: true
          id: api-contract-coverage
          pass_criteria: "contrato request/response validado; tests del flujo nuevo en verde"
        on_fail: "reintenta"
      - name: auditoria_secretos
        executor_model: sol
        agent: appsec-engineer
        tools: ["code-quality-contract", "gitleaks"]
        gate:
          blocking: true
          id: zero-plaintext-secrets
          pass_criteria: "0 hallazgos de secretos/credenciales en texto plano"
        on_fail: "detiene"
      - name: critic_diff
        executor_model: sol
        agent: Check-Reviewer
        gate:
          blocking: true
          id: critic-ears-evidence
          pass_criteria: "cada criterio EARS tiene test o log citado"
        on_fail: "escala a sol"

  db_migration:
    task_type: db_migration
    trigger_keywords: ["ALTER", "DDL", "DML", "migracion DB2", "schema", "QSYS2"]
    planner_model: sol
    note: "Alto riesgo. Casi nada se abarata."
    phases:
      - name: spec_ears
        executor_model: sol
        agent: DB2-AS400-Specialist
        gate:
          blocking: true
          id: ears-criteria-verifiable
          pass_criteria: "objetivo referencia R1_T8CDVD si toca objetivos; nunca LCCDVD por error; QSYS2 antes de inventar columnas"
        on_fail: "detiene"
      - name: maker
        executor_model: sol
        agent: maker
        tools: ["ibm-db2-mcp", "db2-query-patterns", "db2-safe-change"]
        gate:
          blocking: true
          id: sql-parameterized-qsys2
          pass_criteria: "0 queries no parametrizadas; QSYS2 usado antes de citar columnas"
        on_fail: "detiene"
      - name: verificacion_reversibilidad
        executor_model: sol
        agent: Technical-Verifier
        gate:
          blocking: true
          id: rollback-script-exists
          pass_criteria: "existe script de rollback escrito ANTES de aplicar en entorno real"
        on_fail: "detiene y pide humano"
      - name: critic_diff
        executor_model: sol
        agent: Check-Reviewer
        gate:
          blocking: true
          id: critic-ears-evidence
          pass_criteria: "rollback + idempotencia + alcance JAVIER vs DSEDAC citados"
        on_fail: "detiene"

  financial:
    task_type: financial
    trigger_keywords: ["comisiones", "objetivos", "R1_T8CDVD", "Proxenos", "inversion", "liquidacion"]
    planner_model: sol
    note: "Nunca terra. Un error de numero cuesta mas que el modelo."
    phases:
      - name: spec_ears
        executor_model: sol
        gate:
          blocking: true
          id: ears-criteria-verifiable
          pass_criteria: "columna de objetivos R1_T8CDVD; ventas comision LCCDVD; no mezclar"
        on_fail: "detiene"
      - name: maker
        executor_model: sol
        agent: maker
        gate:
          blocking: true
          id: commercial-column-invariant
          pass_criteria: "invariantes de COMMERCIAL_TARGETS: meses cerrados intocables; pin suma = total acordado"
        on_fail: "detiene"
      - name: critic_diff
        executor_model: sol
        agent: Check-Reviewer
        gate:
          blocking: true
          id: critic-ears-evidence
          pass_criteria: "2-3 comerciales sensibles verificados vs LY+10% R1; delta >15% injustificado = BLOCK"
        on_fail: "detiene y pide humano"

  mechanical:
    task_type: mechanical
    trigger_keywords: ["typo", "formateo", "rename", "comentario", "traduce copy"]
    planner_model: sol
    phases:
      - name: maker
        executor_model: terra
        agent: maker
        gate:
          blocking: true
          id: code-quality-contract
          pass_criteria: "diff acotado al archivo pedido; elite-quality-gate sobre esos files si hay codigo"
        on_fail: "escala a sol"

  factory:
    task_type: factory
    trigger_keywords: ["app completa", "desde cero para un cliente", "fabrica", "producto serio", "entregable", "SEO + backend + frontend", "web para un", "saas", "ecommerce", "para mi cliente"]
    planner_model: sol
    departments_default: [product, architecture, design, backend, frontend, a11y, seo, performance, security, qa, observability, ci, copy, legal, analytics, docs, growth]
    note: >
      Agencia completa, no solo PR. Idea -> spec -> capas -> backend -> frontend ->
      a11y/copy/legal -> SEO -> perf -> observabilidad/CI -> AppSec -> critic ->
      contrato de entregable -> PR. Un maker. Skills = oficios. Prod = adelante.
    phases:
      - name: living_spec
        executor_model: sol
        agent: product-ux
        tools: ["openspec-explore", "goal-loop-manager"]
        gate:
          blocking: true
          id: living-spec-exists
          pass_criteria: "spec EARS + reglas de negocio + fuera de alcance escritas antes de codigo"
        on_fail: "detiene y pide humano (max 3 preguntas)"
      - name: architecture
        executor_model: sol
        agent: Architect-Planner
        gate:
          blocking: true
          id: layered-architecture
          pass_criteria: "capas declaradas; frontend no habla a DB; contratos de API listados"
        on_fail: "detiene"
      - name: backend_vertical
        executor_model: terra
        agent: maker
        tools: ["node-backend-patterns"]
        gate:
          blocking: true
          id: api-contract-coverage
          pass_criteria: "auth + validacion + errores tipados + credentials_ref; test del endpoint critico en verde"
        on_fail: "reintenta"
      - name: frontend_vertical
        executor_model: terra
        agent: maker
        tools: ["frontend-ui-engineering", "greenfield-pipeline"]
        gate:
          blocking: true
          id: visual-browser-or-golden
          pass_criteria: "flujo critico en verde (Playwright a11y o widget test); loading/empty/error"
        on_fail: "reintenta"
      - name: seo
        executor_model: terra
        agent: maker
        tools: ["seo-optimization"]
        gate:
          blocking: true
          id: seo-baseline
          pass_criteria: "title unico, meta, un h1, OG; sitemap o noindex explicito; 0 rotos en nav"
        on_fail: "reintenta"
      - name: optimization
        executor_model: terra
        agent: maker
        tools: ["lighthouse_ci", "performance-optimization"]
        gate:
          blocking: true
          id: web-vitals-or-flutter-perf
          pass_criteria: "LCP<2.5s INP<200ms CLS<0.1 o equivalente Flutter documentado"
        on_fail: "reintenta con el reporte, no con una impresion"
      - name: a11y_copy_legal
        executor_model: terra
        agent: product-ux
        tools: ["accessibility-audit", "ux-writing"]
        gate:
          blocking: true
          id: a11y-baseline
          pass_criteria: "0 axe serio/critico o Semantics Flutter; 0 lorem; privacy/cookies si web publica UE, o noindex+razon"
        on_fail: "reintenta"
      - name: observability_ci
        executor_model: terra
        agent: qa-automation-lead
        tools: ["monitoring-stack", "error-handling", "cicd-pipeline"]
        gate:
          blocking: true
          id: observability-baseline
          pass_criteria: "health; 0 console.log; errores no silenciosos; CI o razon de no-CI en el PR"
        on_fail: "reintenta"
      - name: analytics_or_explicit_off
        executor_model: terra
        agent: maker
        gate:
          blocking: true
          id: analytics-baseline
          pass_criteria: "eventos del flujo critico o no-tracking escrito en la spec"
        on_fail: "reintenta"
      - name: secure_scan
        executor_model: sol
        agent: appsec-engineer
        gate:
          blocking: true
          id: zero-plaintext-secrets
          pass_criteria: "0 secretos en texto plano; 0 SQL concat; AppSec no escribe el parche"
        on_fail: "detiene"
      - name: critic_diff
        executor_model: sol
        agent: Check-Reviewer
        gate:
          blocking: true
          id: critic-ears-evidence
          pass_criteria: "cada criterio EARS + anti_vibe del product-delivery-contract citados"
        on_fail: "escala a sol"
      - name: delivery_contract
        executor_model: sol
        agent: Technical-Verifier
        tools: ["code-quality-contract", "elite-quality-gate"]
        gate:
          blocking: true
          id: product-delivery-contract
          pass_criteria: "code-quality-contract PASS y 0 BLOCK elite. Sin PASS no hay entregable"
        on_fail: "goal-loop tick; max 12; luego detiene"
      - name: open_pr
        executor_model: sol
        agent: sre-engineer
        tools: ["gh pr create"]
        gate:
          blocking: true
          id: pr-evidence
          pass_criteria: "PR abierto con body de evidencia; no merge a main; prod exige adelante"
        on_fail: "detiene y pide humano"

  bug_loop:
    task_type: bug_loop
    trigger_keywords: ["no pares hasta que pase", "hasta que CI verde", "arregla los bugs"]
    planner_model: sol
    phases:
      - name: reproduce
        executor_model: sol
        agent: Repo-Explorer
        gate:
          blocking: true
          id: ears-criteria-verifiable
          pass_criteria: "fallo reproducido con comando y exit code, no con una teoria"
        on_fail: "detiene"
      - name: maker
        executor_model: terra
        agent: maker
        gate:
          blocking: true
          id: system-tests-and-a11y
          pass_criteria: "el comando que fallaba ahora exit 0"
        on_fail: "reintenta; max 3 luego escala a sol"
      - name: critic_diff
        executor_model: sol
        agent: Check-Reviewer
        gate:
          blocking: true
          id: critic-ears-evidence
          pass_criteria: "fix acotado; regression test del fallo original"
        on_fail: "escala a sol"

  ship_pr:
    task_type: ship_pr
    trigger_keywords: ["abre un PR", "crea pull request", "haz PR", "sube el PR"]
    planner_model: sol
    note: "PR != produccion. Merge a main y deploy siguen gated."
    phases:
      - name: evidence
        executor_model: sol
        agent: Technical-Verifier
        gate:
          blocking: true
          id: code-quality-contract
          pass_criteria: "scorecard PASS o BLOCK honesto en el body del PR"
        on_fail: "no abrir PR"
      - name: open_pr
        executor_model: sol
        agent: sre-engineer
        gate:
          blocking: true
          id: pr-evidence
          pass_criteria: "gh pr create con evidencia; base no es un force a main"
        on_fail: "detiene"

