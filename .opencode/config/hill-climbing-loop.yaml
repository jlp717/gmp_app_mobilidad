version: 1
enabled: true
name: hill-climbing-loop
description: "Bucle de mejora continua automático: analiza traces semanales, propone patches al harness, aprueba y mide delta"
schedule:
  cron: "0 2 * * 0"  # Domingo 02:00
  timezone: "Europe/Madrid"
  job_id: "hill_climbing_loop"

collect:
  window_days: 7
  sources:
    - name: flow_trace
      tool: flow-trace
      params:
        limit: 1000
        mode: "full"
    - name: handoff_ledger
      tool: handoff-ledger
      params:
        operation: "summarize"
    - name: team_trace
      source: ".opencode/TEAM_TRACE.jsonl"
      parser: "jsonl"
    - name: same_error_detector
      source: ".opencode/memory/same-error-tracker.jsonl"
      parser: "jsonl"
    - name: elite_quality_gate_history
      source: ".opencode/state/quality-gate-history.jsonl"
      parser: "jsonl"
    - name: model_assignment_audit
      tool: model-assignment-audit
      params:
        fail_on_warn: false
    - name: agent_roster_audit
      tool: agent-roster-audit
      params:
        fail_on_warn: false
    - name: workflow_state_audit
      tool: workflow-state-audit
      params:
        fail_on_warn: false
    - name: audit_ledger
      source: ".opencode/audit/LEDGER.yaml"
      parser: "yaml"
    - name: readiness_smoke_history
      source: ".opencode/state/readiness-history.jsonl"
      parser: "jsonl"
    - name: github_watchlist
      tool: github-watchlist-sync
      params:
        lookback_days: 7
        notify_telegram: false
    - name: tech_radar
      tool: tech-radar-fetch
      params:
        max_items_per_source: 10
        sources: ["hn", "github_trending", "github_recent", "mcp_registry", "awesome_copilot", "arxiv"]

analyze:
  agent: "loop-optimizer"
  extends: "continuous-improvement-loop"
  inputs:
    - "flow_trace"
    - "handoff_ledger"
    - "team_trace"
    - "same_error_detector"
    - "elite_quality_gate_history"
    - "model_assignment_audit"
    - "agent_roster_audit"
    - "workflow_state_audit"
    - "readiness_smoke_history"
    - "audit_ledger"
    - "github_watchlist"
    - "tech_radar"
  output_schema:
    recurring_failures:
      - error_hash: "string"
        occurrences: "integer"
        agents: "array[string]"
        root_cause_hypothesis: "string"
        proposed_fix: "string"
    quality_drift:
      - criterion: "string"
        trend: "string"  # worsening|improving|stable
        files_affected: "array[string]"
        proposed_rubric_tightening: "string"
    token_bottlenecks:
      - agent: "string"
        avg_tokens: "integer"
        peak_tokens: "integer"
        proposed_model_change_or_scope_reduction: "string"
    unused_skills:
      - skill: "string"
        last_used_days_ago: "integer"
        proposed_removal_or_integration: "string"
    failing_gates:
      - gate: "string"
        failure_rate: "number"
        proposed_threshold_adjustment_or_removal: "string"
    new_patterns:
      - pattern: "string"
        source: "string"
        proposed_integration_into_skills_or_protocol: "string"
    security_findings:
      - finding: "string"
        severity: "string"  # low|medium|high|critical
        proposed_guardrail_addition: "string"

propose:
  output_dir: ".opencode/proposals"
  naming_template: "hillclimb-{timestamp}-{id}.json"
  patch_schema:
    target_file: "string"  # .opencode/config/{chief-protocol|task-classification|model-routing|handoff-contract|quality-rubric|verification-loop|autonomous-flow|goal-loops|automation-schedule}.yaml
    diff: "string"  # unified diff exacto
    impact: "string"  # low|medium|high
    risk_level: "string"  # R0|R1|R2|R3|R4
    rollback_plan: "string"  # comando exacto para revertir
    evidence_ref: "object"  # trace_ids, task_ids, error_hashes
    proposed_by: "hill-climbing-loop"
    requires_approval: true

approve:
  gate: "plan-approval-gate"
  notification:
    tool: "mobile-briefing"
    params:
      send_telegram: true
      save_obsidian: true
  presentation_format: |
    📈 Hill-Climbing Loop - Propuestas de la semana
    
    {count} patches generados:
    {patches_summary}
    
    Responde: "apruebo el plan" / "adelante con el plan" / "aprobado" para aplicar todo
    O rechaza individualmente: "rechaza patch-{id}"
  timeout_hours: 24
  auto_reject_on_timeout: true
  approval_keywords:
    - "apruebo el plan"
    - "adelante con el plan"
    - "aprobado"

apply:
  atomic: true
  smoke_tests:
    - tool: "readiness-smoke"
      params:
        json: true
    - tool: "agent-roster-audit"
      params:
        fail_on_warn: false
    - tool: "model-assignment-audit"
      params:
        fail_on_warn: false
    - tool: "workflow-state-audit"
      params:
        fail_on_warn: false
  on_success:
    - tool: "telegram-notify"
      params:
        level: "success"
        message: "✅ Hill-Climbing Loop: {count} patches aplicados. Smoke tests PASS."
        project: "system"
    - tool: "memory-save"
      params:
        kind: "lesson"
        record:
          type: "hillclimb_apply"
          patches_applied: "array[string]"
          timestamp: "ISO8601"
  on_failure:
    - tool: "snapshot-restore"
      params:
        task_id: "hillclimb-{timestamp}"
    - tool: "telegram-notify"
      params:
        level: "error"
        message: "❌ Hill-Climbing Loop: Smoke test FAIL. Auto-rollback ejecutado. Revisar logs."
        project: "system"
    - action: "BLOCK"

measure:
  baseline_window_days: 7
  comparison_window_days: 7
  metrics_file: ".opencode/metrics/hillclimb-results.jsonl"
  comparison_metrics:
    - "avg_task_duration_seconds"
    - "token_usage_per_task"
    - "gate_failure_rate"
    - "error_recurrence_rate"
    - "agent_handoff_latency_ms"
    - "model_fallback_rate"
    - "readiness_smoke_pass_rate"
  on_negative_delta:
    - tool: "snapshot-restore"
      params:
        task_id: "hillclimb-{timestamp}"
    - tool: "retrospective-trigger"
      params:
        error_hash: "hillclimb-negative-delta"
        occurrences: 1
        agents_involved: ["hill-climbing-loop"]
        error_samples: ["Delta negativo detectado en métricas post-cambio"]

manual_trigger:
  keyword: "Equipo, ejecuta hill climbing"
  agent: "chief-engineer-assistant"
  action: "invoca loop-optimizer directamente"

rollback:
  snapshot_prefix: "hillclimb-"
  max_snapshots_kept: 10

notification:
  weekly_summary:
    tool: "mobile-briefing"
    params:
      send_telegram: true
      save_obsidian: true
  critical_alert:
    tool: "telegram-notify"
    params:
      level: "error"
      project: "system"

safety:
  max_patches_per_week: 20
  max_risk_level: "R3"  # R4 requiere aprobación explícita adicional
  require_human_approval_for:
    - "chief-protocol.yaml"
    - "task-classification.yaml"
    - "model-routing.yaml"
    - "production-approval-gate"
  dry_run_default: true