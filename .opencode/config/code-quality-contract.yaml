version: 1
enabled: true
purpose: >
  Filtro que sustituye la revision humana de codigo de la IA.
  Si PASS, el diff es lo bastante serio, mantenible y escalable para cerrar.
  Si BLOCK, el maker itera. Max 3 repair loops (loop-gate).
enforcer: ".opencode/tools/code-quality-contract.ts"
rubric: ".opencode/config/quality-rubric.yaml"
elite_gate: ".opencode/config/elite-quality-gate.yaml"
politec: "scripts/politec-quality-gate.ps1"

applies_to_playbooks: [build, sweep, secure]
tiny_if_diff: true

pass_means:
  - "Javier no revisa el diff linea a linea"
  - "El Chief puede decir hecho solo con este PASS + evidencia de tests"

block_means:
  - "No cerrar. Devolver al maker con findings"
  - "Nunca afirmar tests/QA/seguridad sin haberlos corrido"

checklist:
  - id: POL-P
    name: Purpose
    metric: "El diff hace una sola cosa alineada al brief"
    block_if: "scope escape o archivos fuera del playbook"
  - id: POL-O
    name: Organization
    metric: "Flutter en capas feature. Backend route/service/repo. Cero SQL en routes nuevas"
    block_if: "Dart suelto en lib/features/<x>/ o SQL en routes"
  - id: POL-L
    name: Legibility
    metric: "Nombres claros, sin any/dynamic injustificado, sin console.log/print de produccion"
    block_if: "any/dynamic o print/console.log en lib/ o backend/routes"
  - id: POL-I
    name: Integration
    metric: "Contrato API estable. Tabs en _getNavItems y _buildCurrentPage. Colores AppColors. Semantics en interactivos. Spec EARS en T2+"
    block_if: "tab a medias, Color hex suelto fuera de app_colors, o BUILD T2+ sin criterios EARS"
  - id: POL-T
    name: Tests
    metric: "Test del flujo critico ejecutado. Exit 0. Comando y resultado en evidencia"
    block_if: "codigo nuevo sin test del flujo critico"
  - id: POL-E
    name: Efficiency
    metric: "N+1 = 0. Sin await en forEach. Listas con orden y paginacion"
    block_if: "elite-quality-gate N+1 / async_loop / select *"
  - id: POL-C
    name: Compliance
    metric: "SQL parametrizado. Cero secretos literales. Auth en routes. credentials_ref. Deploy whitelist"
    block_if: "sql_string_concat, secreto literal, o mutacion prod sin gate"

deterministic_scans:
  - elite-quality-gate
  - "rg print\\(|console\\.log en files del diff"

thresholds:
  elite_block: 0
  n_plus_one: 0
  sql_unsafe: 0
  secrets: 0
  test_exit: 0

evidence_schema:
  - files_scanned
  - elite_status
  - test_command
  - test_exit_code
  - politec_notes
  - status  # PASS | BLOCK
