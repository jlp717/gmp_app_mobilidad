version: 1
enabled: true
purpose: "Harness engineering: el sistema que hace al equipo fiable, repetible, observable y mejorable."

principles:
  - "El objetivo y la evidencia mandan; no se acepta una afirmacion sin check ejecutable."
  - "Preferir checks deterministas antes que graders LLM."
  - "Maker y checker tienen contexto y permisos separados."
  - "Cada loop tiene max_iterations, timeout, budget y rollback."
  - "Los modelos nuevos entran por catalogo, probe, regresion y promotion gate."

closed_lifecycle:
  phases: [DISCOVER, PLAN, EXECUTE, VERIFY, ITERATE]
  completion_states: [PASS, WARN, BLOCK, NEEDS_INFO]
  max_repair_iterations: 3
  max_no_progress_rounds: 2

deterministic_gate:
  source: "scripts/verify.ps1"
  quality_source: "scripts/politec-quality-gate.ps1"
  ci_source: ".github/workflows/verification-loop.yml"
  order:
    - "format_and_static_analysis"
    - "unit_and_integration_tests"
    - "security_and_secret_scan"
    - "quality_rubric"
    - "performance_or_visual_checks_when_applicable"
  no_false_pass: true

agentic_verification:
  maker: "specialist assigned by decision-router"
  checker: ["Technical-Verifier", "truth-teller"]
  checker_read_only: true
  rubric: ".opencode/config/quality-rubric.yaml"
  handoff_contract: ".opencode/config/handoff-contract.yaml"
  evidence_required: true

context_and_state:
  state_manager: "state-manager"
  goal_manager: "goal-loop-manager"
  handoff_ledger: "handoff-ledger"
  audit_ledger: ".opencode/audit/LEDGER.yaml"
  traces: [".opencode/TEAM_TRACE.jsonl", ".opencode/state/flow-trace-latest.json"]
  context_packet_max_tokens: 8000
  context_compaction_before_limit: true
  feature_registry: ".opencode/harness/feature-list.json"
  progress_log: ".opencode/harness/progress.jsonl"

long_running_sessions:
  initializer:
    first_run: "discover repository, verify startup/test commands, create feature registry and progress log"
    required_artifacts: ["feature_registry", "progress_log", "initial_health_evidence"]
  coding_session:
    start: ["read progress_log", "read git log", "run baseline smoke", "select one incomplete feature"]
    end: ["run applicable checks", "record evidence", "leave clean worktree", "update progress_log"]
  feature_status_values: ["pending", "in_progress", "passing", "blocked"]

browser_and_runtime_verification:
  browser_mcp: ["playwright", "chrome-devtools"]
  required_for: ["web_frontend", "browser_behavior", "visual_regression", "user_flow"]
  evidence: ["console", "network", "screenshot_or_a11y_snapshot", "test_result"]

parallel_execution:
  isolation: "worktree-manager"
  max_concurrent_workstreams: 8
  shared_files_require_serialization: true
  no_scope_escape: true

model_harness:
  catalog_watch: "model-catalog-watch"
  probe: ".opencode/scripts/models/provider-model-probe.mjs --live --write-report"
  regression_score_min: 95
  proposal_directory: ".opencode/proposals"
  critical_promotion_requires: "plan-approval-gate"
  rollback_window_hours: 24

automation:
  scheduler: "scheduled-automation-runner"
  catalog_interval_hours: 12
  improvement_interval_hours: 168
  startup_preflight: true
  telegram_on_block_or_approval: true

human_gates:
  - "production"
  - "DB2 DDL/DML"
  - "secret_rotation"
  - "deploy_or_rollback"
  - "critical_model_promotion"
