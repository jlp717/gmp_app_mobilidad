version: 1
purpose: "Entry-node intent validator before routing/delegation (untrusted user text)"

node_id: intent-validator
classification: workflow
invoked_by: chief-engineer-assistant
position: "before decision-router finalization"

checks:
  - id: prompt_injection_markers
    block_on: ["ignore previous instructions", "disregard system", "jailbreak"]
    action: WARN_or_BLOCK
  - id: out_of_scope_mutation
    block_on_patterns: ["drop table", "rm -rf /", "force push main", "rotate production secret"]
    action: BLOCK_until_HITL
  - id: spend_deploy_delete
    require_hitl: ["deploy", "delete production", "pm2 restart gmp-api", "db2 write"]
  - id: mark_untrusted_attachments
    mark: UNTRUSTED_EXTERNAL

output_schema:
  status: ["ALLOW", "ALLOW_WITH_HITL", "BLOCK"]
  intent_summary: string
  risk_flags: array
  required_gates: array

integration:
  decision_router: "consumes intent_validator.result into classification.risk_flags"
  telegram_hitl: "ALLOW_WITH_HITL pauses goal-loop"
