version: 1
standard_id: opencode-master-agent-standard
updated: "2026-08-03"
priority_order: [security, anti_infinite_loop, aci, context, cost, evals, observability, change_control]

sections:
  1_graph_topology:
    actor_critic: "verification-loop.yaml maker/checker + Technical-Verifier/truth-teller"
    max_iterations_critical_error: "goal-loop-manager CRITICAL_ERROR on max_iterations"
    state_snapshot: "state-manager operation=snapshot"
    conditional_routing: "decision-router + orchestrator-decision-tree.yaml"
    patterns_doc: "docs/opencode-agent-governance/workflow-patterns.md"
  2_aci:
    registry: "docs/opencode-agent-governance/canon/tool-aci-registry.yaml"
    poka_yoke: "destructive tools require confirm=true + HITL when annotated"
    per_tool_tests: "scripts/opencode-governance/governance.test.mjs"
  3_context:
    strategy_doc: "docs/opencode-agent-governance/context-strategy.md"
    worker_packet: "handoff-contract.yaml"
    compaction: "context-compaction.yaml hybrid + note-taking"
  4_security:
    controls_doc: "docs/opencode-agent-governance/security-controls.md"
    sandbox: "canon/sandbox-policy.yaml + sandbox-run.ts (Docker|process_isolate)"
    intent_validator: "canon/intent-validator.yaml"
  5_cost:
    circuit_breaker: "production-safety.yaml financial_circuit_breaker $25"
    complexity_routing: "model-routing Sol/Terra/Luna"
    retries: "model_routing.fallback_policy max_retries=2 exponential backoff declared"
    fallbacks: "fallback-models.json + per-agent model"
  6_evals:
    suite: "docs/opencode-agent-governance/evals/"
    calibration: "docs/opencode-agent-governance/evals-calibration.md"
  7_observability:
    otel_conventions: "canon/otel-agentops.yaml (gen_ai.* + optional OTEL_EXPORTER_OTLP_ENDPOINT)"
    spans: "flow-observability plugin (file + fail-soft OTLP/HTTP JSON)"
    cost_metrics: "metrics-record + scripts/opencode-governance/cost-latency-threshold.mjs"
    alerts: "thresholds in cost-latency-threshold + Telegram"
  8_change_control:
    changelog: "docs/opencode-agent-governance/CHANGELOG.md"
    canary: "canary-eval-rollback.mjs + CI canary-eval-rollback job (auto-rollback markers)"
    no_self_update_prod: "security-gate proposal-only; team-ci blocks unapproved config writes"
