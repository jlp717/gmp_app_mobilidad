version: 1
purpose: "Agent-Tool Interface registry — model-friendly descriptions, annotations, bounds"

global_rules:
  - "Every tool description must state WHEN to use and WHEN NOT to use."
  - "Destructive / open-world tools require annotations + confirmation."
  - "High-impact tools bounded per agent (Chief/SRE/DevOps only unless listed)."

annotations:
  destructive: ["snapshot-restore", "staging-deploy", "state-cleanup", "sandbox-run"]
  open_world: ["tech-radar-fetch", "github-advanced", "web research MCP", "sandbox-run network=true"]
  hitl_required: ["production-approval-gate", "staging-deploy", "state-cleanup hard"]

tools:
  - name: sandbox-run
    description: "Run command in ephemeral Docker sandbox under /workspace only. Prefer for untrusted code. Do NOT use for production hosts."
    example: |
      { "image": "node:20-alpine", "command": ["node", "-e", "console.log(1)"], "timeout_seconds": 30, "network": false }
    params:
      image: { type: string, allowlist: true }
      command: { type: "string[]", min: 1 }
      timeout_seconds: { type: int, default: 30, max: 30 }
      network: { type: boolean, default: false }
      confirm: { type: boolean, required_if_destructive: true }
    annotations: [destructive, open_world]
    allowed_agents: [chief-engineer-assistant, DevOps-CICD-Specialist, sre-engineer, qa-automation-lead, appsec-engineer]

  - name: production-approval-gate
    description: "Issue short-lived production token only when staging+QA+AppSec+SRE PASS. Never invent PASS."
    annotations: [destructive, hitl_required]
    allowed_agents: [chief-engineer-assistant, sre-engineer]

  - name: goal-loop-manager
    description: "Bounded goal loops. On max_iterations returns CRITICAL_ERROR. Do not retry silently."
    annotations: []
    allowed_agents: [chief-engineer-assistant]

  - name: state-manager
    description: "Persist task StateGraph. Use operation=snapshot after each node. Do not store secrets."
    annotations: []
    allowed_agents: [chief-engineer-assistant, Context-Manager, GMP-Orchestrator]

  - name: handoff-ledger
    description: "Record compressed context_packet and specialist_output. Workers get packet only, not full thread."
    annotations: []
    allowed_agents: [chief-engineer-assistant]

  - name: intent-validator
    description: "Validate user intent before routing. BLOCK jailbreak/out-of-scope destructive requests without HITL."
    annotations: []
    allowed_agents: [chief-engineer-assistant, prompt-optimizer]

poka_yoke:
  confirm_param: confirm
  message: "Set confirm=true after Javier HITL for destructive actions."

audit_graph_nodes:
  source_of_truth: ".opencode/audit/ACI.yaml"
  note: "ACI de nodos del grafo de auditoria. Tools siguen en tools: arriba. No duplicar side-effects."
  nodes:
    - id: context_loader
      agent: Context-Manager
      inputs: [learned.yaml, AGENTS.md, AUDIT_STATE, LEDGER, ACI, project-state, user-corrections]
      outputs: [context_packet, rules_in_force]
      side_effects: "No escribe learned.yaml; no muta producto"
    - id: orchestrator
      agent: chief-engineer-assistant
      inputs: [context_packet, flow-policy.yaml, decision-router]
      outputs: [workstreams, required_agents, gates]
      side_effects: "handoff-ledger; no implementa producto"
    - id: coding
      agents: [Node-Express-Specialist, Flutter-Architecture-Specialist, Flutter-UI-Specialist, Flutter-Data-Specialist, code-autopilot]
      outputs: [diffs]
      side_effects: "Producto solo si Orchestrator autoriza fase producto"
    - id: security
      agent: appsec-engineer
      layer2: Security-Validator
      outputs: [security_verdict]
      side_effects: "No PASS inventado; no muta produccion"
    - id: performance
      agents: [Performance-Analyst, Flutter-Performance-Specialist]
      outputs: [perf_findings, n_plus_one_report]
      side_effects: "Solo lectura + metricas"
    - id: design_motion
      agent: Visual-Design-Specialist
      outputs: [visual_risks, motion_notes, motion_tokens]
      side_effects: "No rediseña UI en fase harness"
    - id: seo_a11y
      node: Visual-Design-Specialist
      kind: owned_by_existing_node
      outputs: [a11y_verdict, accessibility_notes]
      side_effects: "No hay quality-a11y-route. Flutter Semantics, no axe."
    - id: infra
      agent: sre-engineer
      layer2: [DevOps-CICD-Specialist, Runtime-Log-Diagnostician]
      outputs: [health_verdict, deploy_command_allowlist_check]
      side_effects: "Whitelist git pull origin test + pm2 restart gmp-api"
    - id: critic
      agents: [business-critic, Check-Reviewer, truth-teller]
      outputs: [adversarial_review, false_claim_flags]
      side_effects: "No confirma por default; no muta codigo; maker nunca se autoevalua"
    - id: verifier
      agent: Technical-Verifier
      outputs: [PASS, WARN, BLOCK, evidence_packet]
      side_effects: "Escribe .opencode/audit/LEDGER.yaml; max 3 repair iterations"
    - id: learning_capture
      agent: memory-formation
      outputs: [user-corrections.jsonl, learned.yaml_proposal]
      side_effects: "learned.yaml solo tras si explicito de Javier"

