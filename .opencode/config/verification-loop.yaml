version: 2
purpose: Verification loop completo maker/checker que reemplaza revision humana de calidad. Pasa = bueno es verdad absoluta.
quality_rubric_reference: .opencode/config/quality-rubric.yaml
quality_rubric_criteria_count: 37
quality_rubric_categories:
- correctness
- security
- performance
- maintainability
- testing
- architecture
- documentation
maker:
  role: implementer
  receives:
  - context_packet
  - acceptance_criteria
  - scope_exclusive
  delivers:
    specialist_output: Implementation artifacts
    evidence:
      min_items: 1
      required_fields:
      - files_read
      - commands_executed
      - runtime_facts_verified
      - tests_run
      - quality_gate_output
      - rubric_evaluation
      - mutation_test_results
      - code_reuse_report
  constraints:
    no_self_grading: true
    no_scope_escape: true
    no_production_mutation: true
critic:
  role: adversarial_reviewer
  runs_after: maker
  runs_before: checker
  composition:
  - agent: Check-Reviewer
  - agent: business-critic
  - agent: truth-teller
  receives:
  - artifacts_from_maker
  - plan
  - claims
  forbidden:
    modifies_code: true
    is_the_maker: true
    self_grade: true
  produces:
    adversarial_review:
      required_fields:
      - verdict
      - false_claim_flags
      - blocking_issues
checker:
  role: verifier
  composition:
  - agent: Technical-Verifier
  - tool: elite-quality-gate
  - tool: scope-creep-detector
  - tool: code-reuse-detector
  - tool: mutation-test-gate
  - config: quality-rubric.yaml
  receives:
  - artifacts_from_maker
  - acceptance_criteria
  - quality_rubric
  forbidden:
    receives_full_context_packet: true
    modifies_code: true
  executes:
    each_criterion_from_rubric:
    - read_rubric_criterion
    - run_verification_tools
    - collect_metric_value
    - compare_against_threshold
    - produce_verdict
  produces:
    verification_report:
      required_fields:
      - criterion
      - tool_output
      - metric_value
      - threshold
      - status
      - evidence_ref
  agent_separation:
    different_agent_id: true
    preferred_different_model: true
    maker_model: openai/gpt-5.6-sol
    checker_model: openai/gpt-5.6-terra
    alternative_checker_model: opencode-go/kimi-k2.7-code
skills_integration:
  vdd:
    description: Verification-Driven Development workflow
    trigger: Before any Tier 2/3 implementation
    ensures: Quality rubric criteria mapped to acceptance tests before coding
  code_reuse_detector:
    description: Detects duplication and proposes reuse before new code
    trigger: During maker execution and checker verification
    maps_to_rubric:
    - MAIN-001
    - TEST-002
  scope_creep_detector:
    description: Detects scope escape and layer violations
    trigger: During checker verification phase
    maps_to_rubric:
    - ARCH-001
    - ARCH-002
    - ARCH-005
  mutation_test_gate:
    description: Runs mutation testing and scores test quality
    trigger: During checker verification phase
    maps_to_rubric:
    - TEST-003
stop_conditions:
  PASS:
    all:
    - quality_rubric_all_criteria_PASS
    - zero_BLOCK_criteria
    - handoff_ledger_summarize_PASS
    - tests_PASS
    - no_scope_escape
    - mutation_score_above_60
    - code_reuse_report_clean
  WARN:
    all:
    - zero_BLOCK_criteria
    - some_criteria_WARN
    - risks_documented
    - rollback_plan_present
    - no_critical_or_high_SECURITY_finding
    - no_N_plus_one_detected
    - no_async_loop_violations
  BLOCK:
    any:
    - any_criterion_BLOCK
    - missing_evidence
    - unverified_entity
    - scope_escape
    - production_risk
    - mutation_score_below_50
    - code_duplication_above_5pct
    - layer_violation_detected
    - uncaught_exception_on_critical_path
  NEEDS_INFO:
    condition: checker cannot verify due to missing context
    action: clarification-gate -> pause
evidence_schema:
  files_read:
    type: array
    items: string
    description: Real file paths read during verification
  commands_executed:
    type: array
    items:
      type: object
      required:
      - command
      - output
      - exit_code
  runtime_facts_verified:
    type: array
    items:
      type: object
      required:
      - fact
      - source
      - verification_method
  tests_run:
    type: array
    items:
      type: object
      required:
      - test_file
      - result
      - coverage_delta
  quality_gate_output:
    type: string
    description: Full output from elite-quality-gate
  rubric_evaluation:
    type: array
    items:
      type: object
      required:
      - criterion
      - status
      - metric_value
      - threshold
      - evidence_ref
  mutation_test_results:
    type: object
    required:
    - mutation_score
    - killed_count
    - survived_count
    - total_mutants
    description: Output from mutation-test-gate (maps to TEST-003)
  code_reuse_report:
    type: object
    required:
    - duplication_pct
    - reuse_opportunities
    - new_code_justified
    description: Output from code-reuse-detector (maps to MAIN-001, TEST-002)
  scope_creep_report:
    type: object
    required:
    - scope_escapes
    - layer_violations
    - circular_deps
    description: Output from scope-creep-detector (maps to ARCH-001, ARCH-002, ARCH-005)
retry_policy:
  max_retries: 1
  on_retry:
    include_previous_verification_report: true
    corrected_context_packet: true
  on_second_failure:
    status: BLOCK
    escalation_to_chief: true
    includes:
    - exact_blocker
    - options
    - safest_next_action
  same_error_detection:
    registers_normalized_hash: true
    second_occurrence_30_days: retrospective-trigger
integration_with_chief_protocol:
  verify_step_uses: this verification-loop
  handoff_ledger_summarize_requirement: MUST report verification-loop PASS before reporting completion
  goal_loop_manager_advance: ONLY advances if verification-loop PASS
handoff_ledger_integration:
  maker_records: record_handoff with context_packet
  checker_records: record_output with specialist_output containing verification_report
  summarize_validates: verification-loop PASS before completion
audit_ledger_integration:
  path: ".opencode/audit/LEDGER.yaml"
  loop_gate: ".opencode/config/loop-gate.yaml"
  max_repair_iterations: 3
  on_pass: "registrar finding status verified o cerrar el AUD-H-* correspondiente; no marcar AUD-B/AUD-I de producto"
  on_block: "append o actualizar finding en LEDGER con evidencia; no PASS inventado"
  note: "El loop de verificacion de auditoria escribe LEDGER, no solo handoffs."
autonomous_mode:
  enabled: true
  no_human_review_gate: true
  passes_absolute_truth: pasa = bueno
escalation:
  chief_notification_on:
  - BLOCK
  - NEEDS_INFO
  telegram_alert_on:
  - BLOCK
  obsidian_record_on:
  - BLOCK
  - WARN
