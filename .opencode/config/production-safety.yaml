production_safety:
  approval_keyword: "adelante"
  approval_tool: "production-approval-gate"
  token_file: ".opencode/state/production-approval-token.json"
  default_ttl_minutes: 30
  protected_targets:
    - "192.168.1.230"
    - "mari-pepa.com"
    - "gmp-api"
    - "main"
    - "master"
    - "production"
  hard_rules:
    - "Tier 2 y Tier 3 siempre despliegan staging antes de produccion."
    - "Produccion requiere PASS de QA, PASS de AppSec y health OK de SRE."
    - "La palabra adelante no basta: production-approval-gate solo emite token si recibe staging_url, qa_status=PASS, appsec_status=PASS, sre_status=PASS y evidence_ref."
    - "Sin token vigente con evidencia completa, el plugin production-safety-guard bloquea acciones peligrosas."
    - "El token caduca por defecto en treinta minutos."
    - "Deploy whitelist (learned.yaml): unicamente git pull origin test seguido de pm2 restart gmp-api. Prohibido editar .env y pm2 set/save/start/reload sin confirmacion explicita de Javier."

  deploy_command_allowlist:
    source: ".opencode/rules/learned.yaml#deploy"
    flow_policy: ".opencode/config/flow-policy.yaml#deploy"
    allowed:
      - "git pull origin test"
      - "pm2 restart gmp-api"
    forbidden_without_explicit_javier:
      - "pm2 set"
      - "pm2 save"
      - "pm2 start"
      - "pm2 reload"
      - "edit .env"

  financial_circuit_breaker:
    enabled: true
    hard_budget_cap_usd: 25
    calculation_method: "estimated_token_cost_by_tier"
    tier_cost_estimates:
      T1_per_agent_usd: 0.05
      T2_per_agent_usd: 0.35
      T3_per_agent_usd: 1.50
    session_accumulator_file: ".opencode/state/session-cost-accumulator.json"
    on_threshold_exceeded:
      state: "COLD_STORAGE"
      actions:
        - "freeze_autonomous_flow"
        - "block_new_delegations"
        - "allow_only_readonly_and_javier_communication"
        - "send_critical_alert_to_telegram"
        - "include_in_next_morning_briefing"
      alert_message: "CIRCUIT BREAKER: Sesion ha excedido $25 USD estimados. Flujo autonomo congelado. Requiere aprobacion manual de Javier."
      unfreeze_requires: "explicit_javier_approval"
      unfreeze_command: "adelante con presupuesto"
