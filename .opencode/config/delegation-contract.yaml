version: 1
purpose: >
  Anthropic Multi-agent Research lesson 2: ensenar al orquestador a delegar.
  Instrucciones vagas ("investiga X") duplican trabajo. Cada worker recibe un contrato.
required_fields:
  - objective
  - output_format
  - tools_allowed
  - sources
  - stop_when
  - not_your_job
isolation: >
  Claude Code + Anthropic Research: cada subagente contexto limpio.
  No hereda el plan del maker. No sabe que existen los otros workers
  salvo el objetivo que le toca. Devuelve sintesis 1000-2000 tokens.

example:
  objective: "Localizar el handler real de cobros pendientes"
  output_format: "{files_found, entities_confirmed, risk_areas}"
  tools_allowed: ["read", "rg"]
  sources: ["lib/features/cobros", "backend/routes"]
  stop_when: "3 archivos confirmados o 10 tool calls"
  not_your_job: "No implementar. No revisar el diff de otro worker."

parallel:
  lead_spawns: "3-5 max en research. 1 writer en build."
  tools_per_worker: "3+ en paralelo cuando las fuentes son independientes"
  anthropic_measured: "hasta 90% menos tiempo en research complejo"

citation_pass:
  agent: Technical-Verifier
  when: "explore con Web-Researcher o cualquier afirmacion factual externa"
  rule: "Cada claim con URL oficial o file:line. Sin fuente = no se afirma."
