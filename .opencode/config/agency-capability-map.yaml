version: 1
purpose: >
  Mapa de agencia. Cientos de programadores = escritorios (departments) + skills.
  El Chief los enciende solo. Javier no nombra disciplinas ni recuerda calidad.
  No es un organigrama de agentes. 1 writer. Skills cargan el oficio.
source_of_truth_runtime: ".opencode/tools/decision-router.ts"
enforcer: ".opencode/tools/flow-policy-check.ts"
user_interface: "Solo Chief via start-opencode-web-gmp.cmd. Equipo, <idea>."

rule:
  agents: "12 permanentes. El resto hidden/on_demand. Nunca 1 agente por oficio."
  skills: "El oficio vive aqui. El router adjunta required_skills segun departments[]."
  always_on: "En todo BUILD/SWEEP/SECURE, sin que Javier lo pida."
  budget: "Max 18 skills por ruta. El resto queda en este mapa para el Chief."

always_on:
  when_playbooks: [build, sweep, secure]
  departments: [quality, architecture, qa, security_baseline, git]
  javier_never_needs_to_say:
    - "codigo senior"
    - "escalable"
    - "mantenible"
    - "pasa QA"
    - "metricas de calidad"
    - "sin errores de produccion"
    - "accesible"
    - "sin secretos"
  meaning: >
    Politec + code-quality-contract + elite-quality-gate + tests del flujo critico
    + SQL parametrizado + 0 secretos + estados loading/empty/error. Intrinseco.

client_delivery_defaults:
  when: "task_type factory o producto publico para cliente"
  departments:
    - product
    - architecture
    - design
    - backend
    - frontend
    - a11y
    - seo
    - performance
    - security
    - qa
    - observability
    - ci
    - copy
    - legal
    - analytics
    - docs
    - growth
  not_automatic_until_signaled:
    - payments
    - i18n
    - email
    - cms
    - search
    - offline
    - push
    - pdf
    - data_bi
    - admin
  why_not_all_at_once: >
    Una web de restaurante no necesita Stripe ni i18n. El escritorio se enciende
    por senal. Factory SIEMPRE enciende client_delivery_defaults.

departments:
  quality:
    desk: "Staff engineer / calidad"
    always_on: true
    skills: [code-quality-contract, ponytail, production-grade-checklist, best-practices]
    gates: [code-quality-contract]
    blocks: ["any injustificado", "console.log", "TODO en camino critico", "N+1"]
  architecture:
    desk: "Arquitecto"
    always_on: true
    skills: [living-spec, spec-driven-development, planning-and-task-breakdown]
    gates: [layered-architecture, spec-ears-before-code]
    blocks: ["frontend habla a DB", "SQL en routes"]
  qa:
    desk: "QA lead"
    always_on: true
    skills: [test-driven-development, qa-checklist, regression-safety-checks, qa-e2e-patterns]
    gates: [qa-pass, system-tests-and-a11y]
    blocks: ["hecho sin test del flujo critico", "test skipped"]
  security_baseline:
    desk: "AppSec baseline"
    always_on: true
    skills: [security-and-hardening, auth-security, addy-security-checklist]
    gates: [zero-plaintext-secrets, sql-parameterization]
    blocks: ["secreto literal", "SQL concat", "ruta sin auth"]
  git:
    desk: "Release / git"
    always_on: true
    skills: [git-commit-discipline, release-evidence-gate]
    never: "commit o push sin peticion explicita"
  product:
    desk: "Product manager"
    skills: [living-spec, product-design-docs, idea-refine, scope-creep-detector]
    gates: [living-spec-exists]
    output: "usuario, flujo, reglas de negocio, fuera de alcance"
  design:
    desk: "Product design / UX"
    skills: [frontend-design, ux-writing, polish, responsive-design]
    gates: [design-tokens-or-appcolors]
    blocks: ["hex suelto", "pantalla sin loading/empty/error"]
  frontend:
    desk: "Frontend (web o Flutter)"
    skills: [frontend-ui-engineering, gmp-mobilidad-flutter, flutter-riverpod-gmp, nextjs-app-router, granja-nextjs-shadcn]
  backend:
    desk: "Backend / API"
    skills: [node-backend-patterns, nodejs-express, api-spec-first, api-and-interface-design, jwt-refresh-flow]
    gates: [api-contract-coverage, credentials-ref-only]
  database:
    desk: "DB2 / datos"
    skills: [db2-safe-change, db2-query-patterns, db2-odbc, db2-ibm-i-quirks, database-migration]
    gates: [sql-parameterized-qsys2, rollback-script-exists]
  a11y:
    desk: "Accesibilidad"
    skills: [accessibility-audit, addy-accessibility-checklist]
    gates: [a11y-baseline, system-tests-and-a11y]
    pass: "0 axe serio/critico web; Semantics en Flutter; reduced-motion"
  seo:
    desk: "SEO tecnico"
    skills: [seo-optimization]
    gates: [seo-baseline]
    pass: "title unico, meta, un h1, OG, canonical, sitemap o noindex, 0 rotos nav, json-ld si aplica"
  performance:
    desk: "Performance"
    skills: [performance-optimization, performance-profiling, cache-strategy, addy-performance-checklist]
    gates: [web-vitals-or-flutter-perf, n-plus-one-blocking-gate]
  observability:
    desk: "SRE / observabilidad"
    skills: [monitoring-stack, error-handling, debugging-and-error-recovery, sre-runbooks]
    gates: [observability-baseline]
    pass: "health endpoint; logs estructurados; 0 console.log; error no silencioso"
  ci:
    desk: "CI/CD"
    skills: [cicd-pipeline, ci-cd-and-automation, release-evidence-gate]
    gates: [pr-evidence]
  copy:
    desk: "UX writing"
    skills: [ux-writing]
    gates: [copy-no-placeholder]
    blocks: ["lorem ipsum", "placeholder de copy en entregable"]
  legal:
    desk: "Legal / privacidad UE"
    skills: [security-and-hardening, production-grade-checklist]
    gates: [legal-privacy-baseline]
    when: "web publica, Espana, UE, cookies, GDPR, cliente final"
    pass: "privacy y cookies o noindex+razon; 0 tracking sin consentimiento si hay analytics"
  analytics:
    desk: "Analytics / medicion"
    skills: [team-metrics]
    gates: [analytics-baseline]
    pass: "eventos del flujo critico o no-tracking explicito"
  docs:
    desk: "Docs / ADR"
    skills: [docs-sync, documentation-and-adrs, adr-template]
    rule: "docs/ nunca raiz"
  growth:
    desk: "Launch / growth"
    skills: [shipping-and-launch, seo-optimization]
  payments:
    desk: "Billing / pagos"
    skills: [auth-security, api-spec-first, security-and-hardening]
    signals: [stripe, pago, pagos, billing, suscripcion, checkout, pasarela]
    gates: [idempotency-key-required]
    never: "secretos de pasarela en repo"
  i18n:
    desk: "i18n / l10n"
    skills: [i18n-l10n]
    signals: [i18n, traduccion, multiidioma, locale, catalan, ingles]
  email:
    desk: "Email / transactional"
    skills: [error-handling]
    signals: [email, correo, newsletter, smtp, transactional]
  cms:
    desk: "CMS / contenido"
    skills: [docs-sync, ux-writing]
    signals: [cms, blog, contenido, markdown]
  search:
    desk: "Search"
    skills: [rag-retrieval]
    signals: [buscador, search, fulltext]
  offline:
    desk: "Offline / sync"
    skills: [flutter-offline]
    signals: [offline, sin red, sincronizacion]
  push:
    desk: "Push notifications"
    skills: [push-notifications]
    signals: [push, notificacion, fcm]
  pdf:
    desk: "Documentos / PDF"
    skills: [pdf-generation]
    signals: [pdf, factura pdf, albaran pdf]
  data_bi:
    desk: "Datos / BI"
    skills: [powerbi-specialist]
    signals: [powerbi, dashboard, kpi, informe]
  admin:
    desk: "Backoffice / admin"
    skills: [frontend-ui-engineering, node-backend-patterns]
    signals: [admin, backoffice, panel]
  auth:
    desk: "Identidad"
    skills: [auth-security, jwt-refresh-flow]
    signals: [login, jwt, oauth, sesion, rol]
  content:
    desk: "Contenido cliente"
    skills: [ux-writing]
    signals: [copy, textos, microcopy]
  research:
    desk: "Research"
    skills: [source-driven-development, tool-discovery-audit]
    pattern: "3-5 Web-Researcher + citation"
  sre:
    desk: "Produccion"
    skills: [sre-runbooks, ssh-prod-ops, incident-response-runbook]
    whitelist: ["git pull origin test", "pm2 restart gmp-api"]
  financial:
    desk: "Dominio GMP / comisiones"
    skills: [db2-query-patterns, db2-safe-change]
    invariant: "objetivos R1_T8CDVD; comisiones LCCDVD"

signals:
  quality: ["calidad", "senior", "escalable", "mantenible"] # redundante: always_on
  seo: ["seo", "posicionamiento", "sitemap", "google", "meta description", "open graph"]
  a11y: ["accesib", "a11y", "wcag", "aria", "lector de pantalla"]
  i18n: ["i18n", "traduc", "multiidioma", "locale", "l10n", "catalan", "ingles"]
  analytics: ["analytics", "gtm", "ga4", "medicion", "eventos", "tracking"]
  legal: ["gdpr", "rgpd", "privacidad", "cookies", "aviso legal", "lopd", "espana", "ue"]
  payments: ["stripe", "pago", "pagos", "billing", "suscripcion", "pasarela", "checkout"]
  email: ["email", "correo", "newsletter", "smtp"]
  cms: ["cms", "blog", "headless"]
  search: ["buscador", "search"]
  offline: ["offline", "sin red"]
  push: ["push", "fcm", "notificacion push"]
  pdf: ["pdf"]
  data_bi: ["powerbi", "dashboard", "kpi"]
  admin: ["admin", "backoffice", "panel de"]
  auth: ["login", "oauth", "jwt", "sesion"]
  observability: ["sentry", "logs", "health", "observab", "metricas"]
  factory_product:
    - "app completa"
    - "aplicacion completa"
    - "producto para cliente"
    - "entregable"
    - "fabrica"
    - "producir en masa"
    - "web seria"
    - "saas"
    - "nueva app"
    - "app desde cero"
    - "para un cliente"
    - "para mi cliente"
    - "para el cliente"
    - "producto digital"
    - "web para un"
    - "app para un"
    - "tienda online"
    - "ecommerce"
    - "negocio online"

anti_org_chart:
  - "No crear Flutter-SEO-Specialist ni Legal-Cookies-Agent."
  - "Un maker carga los skills del escritorio."
  - "Critic y AppSec no escriben el parche."
  - "10+ workers en codigo: no. Research si, 3-5."
