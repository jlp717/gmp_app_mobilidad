version: 1
project: gmp
graph_id: gmp-agent-graph-v4

nodes:
  - agent_id: chief-engineer-assistant
    identity: "Orquestador principal, entrypoint, decide rutas, valida gates, cero revisión humana de código"
    mandate: "Orquesta todo el flujo V4, decide rutas, valida gates, cero revisión humana de código"
    model: openai/gpt-5.6-sol
    budget_tokens: 50000
    rate_limit: 10
    tier: T3
    role: orchestrator

  - agent_id: prompt-optimizer
    identity: "Optimiza peticiones naturales a brief técnico"
    mandate: "Convierte lenguaje natural en brief técnico ejecutable con acceptance_criteria, risk_flags, delegation_plan"
    model: opencode-go/glm-5.2
    budget_tokens: 5000
    rate_limit: 20
    tier: T1
    role: optimizer

  - agent_id: product-ux
    identity: "Producto/UX - historias verificables"
    mandate: "Historias verificables, criterios de aceptación medibles, síntesis técnica→humano para móvil/Telegram"
    model: opencode-go/glm-5.2
    budget_tokens: 15000
    rate_limit: 10
    tier: T2
    role: product

  - agent_id: Architect-Planner
    identity: "Arquitecto Tier 3 - planes JSON"
    mandate: "Planes JSON con workstreams, dependencias, riesgos, aprobación requerida, zero implementation"
    model: openai/gpt-5.6-sol
    budget_tokens: 80000
    rate_limit: 5
    tier: T3
    role: architect

  - agent_id: sre-engineer
    identity: "Dueño producción/resiliencia"
    mandate: "Health checks 192.168.1.230:3335, SLOs, rollback post-deploy, incident response, post-mortems"
    model: openai/gpt-5.6-sol
    budget_tokens: 40000
    rate_limit: 8
    tier: T3
    role: sre

  - agent_id: appsec-engineer
    identity: "Seguridad full-spectrum"
    mandate: "SAST, secretos, deps, threat modeling, OWASP, DAST selectivo contra staging"
    model: openai/gpt-5.6-sol
    budget_tokens: 40000
    rate_limit: 8
    tier: T3
    role: appsec

  - agent_id: qa-automation-lead
    identity: "QA Lead - orquesta tests"
    mandate: "Orquesta unit, E2E Playwright, k6, contract tests, smoke staging; bloquea release si fallan checks críticos"
    model: openai/gpt-5.6-sol
    budget_tokens: 50000
    rate_limit: 8
    tier: T3
    role: qa

  - agent_id: code-autopilot
    identity: "Detección reutilización RAG"
    mandate: "RAG antes de implementar: recomienda reutilizar/adaptar/estudiar/crear nuevo"
    model: openai/gpt-5.6-sol
    budget_tokens: 20000
    rate_limit: 15
    tier: T2
    role: reuse

  - agent_id: DB2-AS400-Specialist
    identity: "DB2/AS400 - verifica schema real"
    mandate: "Verifica tablas/columnas REALES (QSYS2) antes de cualquier query; readonly discovery first"
    model: openai/gpt-5.6-sol
    budget_tokens: 30000
    rate_limit: 10
    tier: T2
    role: db2_schema

  - agent_id: DB2-Query-Optimizer
    identity: "SQL set-based - elimina N+1"
    mandate: "Elimina N+1, joins, cardinalidad, paginación, orden explícito, índices, coste endpoints con datos reales"
    model: openai/gpt-5.6-sol
    budget_tokens: 30000
    rate_limit: 10
    tier: T2
    role: db2_query

  - agent_id: Node-Express-Specialist
    identity: "Backend Node.js - rutas/servicios"
    mandate: "Rutas validadas, servicios reglas negocio, repos/DB adapters concentran DB2, zero SQL en routes"
    model: openai/gpt-5.6-sol
    budget_tokens: 40000
    rate_limit: 10
    tier: T2
    role: backend

  - agent_id: Flutter-Architecture-Specialist
    identity: "Arquitectura Flutter - capas/nav/providers"
    mandate: "Capas UI/estado/datos, navegación, providers, codegen, offline, contratos backend"
    model: openai/gpt-5.6-sol
    budget_tokens: 40000
    rate_limit: 10
    tier: T2
    role: flutter_arch

  - agent_id: Flutter-UI-Specialist
    identity: "UI Flutter - widgets finos"
    mandate: "Widgets finos, estados loading/empty/error, accesibilidad, validación visual, zero lógica en build()"
    model: opencode-go/glm-5.2
    budget_tokens: 30000
    rate_limit: 15
    tier: T2
    role: flutter_ui

  - agent_id: Flutter-Data-Specialist
    identity: "Datos Flutter - modelos/providers/repos"
    mandate: "Modelos, providers, repositorios, serialización, errores red, offline-first, idempotencia"
    model: openai/gpt-5.6-sol
    budget_tokens: 30000
    rate_limit: 10
    tier: T2
    role: flutter_data

  - agent_id: Technical-Verifier
    identity: "Verificador independiente"
    mandate: "Comprueba que afirmaciones, pruebas, MCPs, logs, DB2, comandos, gates respaldan entrega ANTES de cerrar"
    model: openai/gpt-5.6-sol
    budget_tokens: 25000
    rate_limit: 10
    tier: T3
    role: verifier

