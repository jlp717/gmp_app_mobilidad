version: 6
enabled: true
project: gmp
graph_id: gmp-agent-graph-v6
topology_policy:
  every_edge_target_must_be: [nodes, layer2_hidden, on_demand]
  orphan_edges: forbidden
  maker_never_self_reviews: true
  sequence: "field_guide -> playbook -> maker -> critic -> verifier"
  verification_loop_ledger: ".opencode/audit/LEDGER.yaml"
  loop_gate_max_repair_iterations: 3
  flow_policy_source: ".opencode/config/flow-policy.yaml"
  playbooks_source: ".opencode/config/playbooks.yaml"
  field_guide: ".opencode/memory/FIELD-GUIDE.md"
  learned_rules: ".opencode/rules/learned.yaml"
  no_ghost_routes: true

critic_exemptions:
  comment: "No son makers."
  agents:
    - agent_id: Context-Manager
      reason: "Loader progresivo."
    - agent_id: Repo-Explorer
      reason: "Readonly."
    - agent_id: Technical-Verifier
      reason: "Verifier."
    - agent_id: Check-Reviewer
      reason: "Critic."
    - agent_id: chief-engineer-assistant
      reason: "Orquesta. No se autoevalua."

nodes:
  - agent_id: chief-engineer-assistant
    identity: "Entrypoint. Clasifica playbook. No escribe codigo."
    model: openai/gpt-5.6-sol
    role: orchestrator
    tier: T3
  - agent_id: Context-Manager
    identity: "Carga Field Guide + indice vault. Max 3 notas."
    model: openai/gpt-5.6-luna
    role: context_loader
    tier: T1
  - agent_id: Repo-Explorer
    identity: "Readonly codebase map."
    model: openai/gpt-5.6-luna
    role: explorer
    tier: T1
  - agent_id: Architect-Planner
    identity: "Planner T3/SWEEP. Nunca implementa."
    model: openai/gpt-5.6-sol
    role: planner
    tier: T3
  - agent_id: maker
    identity: "Unico writer. Carga skills del pilar."
    model: openai/gpt-5.6-sol
    role: maker
    tier: T2
  - agent_id: Check-Reviewer
    identity: "Critic. Contexto limpio. Solo el diff."
    model: openai/gpt-5.6-sol
    role: critic
    tier: T3
  - agent_id: Technical-Verifier
    identity: "Verifier. Scorecard + evidencia."
    model: openai/gpt-5.6-sol
    role: verifier
    tier: T3
  - agent_id: qa-automation-lead
    identity: "Tests reales. Exit code."
    model: openai/gpt-5.6-sol
    role: tester
    tier: T2
  - agent_id: appsec-engineer
    identity: "AppSec. No escribe el parche que audita."
    model: openai/gpt-5.6-sol
    role: appsec
    tier: T3
  - agent_id: sre-engineer
    identity: "Prod/SRE. Whitelist deploy."
    model: openai/gpt-5.6-sol
    role: sre
    tier: T3
  - agent_id: DB2-AS400-Specialist
    identity: "Schema QSYS2 primero. SQL set-based."
    model: openai/gpt-5.6-sol
    role: db2
    tier: T2
  - agent_id: product-ux
    identity: "Criterios de aceptacion medibles."
    model: opencode-go/glm-5.2
    role: product
    tier: T2

layer2_hidden:
  comment: "Existen .md. No seleccionables. Skills o on_demand."
  agents:
    - agent_id: GMP-Orchestrator
      note: "LEGACY. No entrypoint."
    - agent_id: prompt-optimizer
      note: "El Chief clasifica playbook. No agente aparte."
    - agent_id: code-autopilot
      note: "Skill RAG del maker."
    - agent_id: Node-Express-Specialist
      note: "Skill del maker."
    - agent_id: Flutter-UI-Specialist
      note: "On demand visual."
    - agent_id: memory-formation
      note: "Tras PASS."

on_demand:
  comment: "Invocables. No Layer-1."
  agents:
    - Flutter-Architecture-Specialist
    - Flutter-Data-Specialist
    - Flutter-Performance-Specialist
    - DB2-Query-Optimizer
    - API-Contract-Specialist
    - Test-Writer
    - Test-Specialist
    - DevOps-CICD-Specialist
    - Runtime-Log-Diagnostician
    - Redis-Cache-Specialist
    - Visual-Design-Specialist
    - Web-Researcher
    - business-critic
    - truth-teller
    - Simplify-Reviewer
    - Code-Reviewer
    - Security-Validator
    - Performance-Analyst
    - NextJS-Shadcn-Specialist
    - team-curator
    - tech-radar-agent
    - Metrics-Observer
    - Release-Notifier
    - memory-cleaner

edges:
  - from: chief-engineer-assistant
    to: [Context-Manager, Repo-Explorer, Architect-Planner, maker, Check-Reviewer, Technical-Verifier, qa-automation-lead, appsec-engineer, sre-engineer, DB2-AS400-Specialist, product-ux, Web-Researcher]
    type: delegation
    gate: none
  - from: maker
    to: Check-Reviewer
    type: review
    payload: diff
    gate: critic-before-verify
  - from: Check-Reviewer
    to: Technical-Verifier
    type: verify
    payload: critic_verdict
    gate: code-quality-contract
  - from: maker
    to: qa-automation-lead
    type: tests
    gate: qa-pass
  - from: maker
    to: DB2-AS400-Specialist
    type: query
    payload: schema
    gate: db2-readonly-discovery-first
  - from: sre-engineer
    to: chief-engineer-assistant
    type: return
    gate: production-approval-gate
  - from: Architect-Planner
    to: chief-engineer-assistant
    type: return
    payload: plan
    gate: plan-approval-gate
