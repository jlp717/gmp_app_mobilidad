<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ruta 3D</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { margin: 0; height: 100%; width: 100%; background: #0b1220; }
    .marker {
      width: 28px; height: 28px; border-radius: 50%;
      background: #1d8cff; color: #fff; font: 700 12px/28px system-ui, sans-serif;
      text-align: center; border: 2px solid #fff;
      box-shadow: 0 4px 12px rgba(0,0,0,.45);
      cursor: pointer;
    }
    .marker.active { background: #ffb020; transform: scale(1.15); }
    .marker.missing { background: #64748b; opacity: .85; }
    #badge {
      position: absolute; top: 12px; left: 12px; z-index: 2;
      background: rgba(11,18,32,.88); color: #e2e8f0; padding: 8px 12px;
      border-radius: 10px; font: 600 12px/1.3 system-ui, sans-serif;
      border: 1px solid rgba(148,163,184,.25);
    }
  </style>
</head>
<body>
  <div id="badge">Vista 3D · tiles OSM (sin token Mapbox)</div>
  <div id="map"></div>
  <script>
    const flutter = window.FlutterMapBridge || null;
    let map = null;
    let markers = [];
    let selectedId = null;

    function post(type, payload) {
      try {
        if (flutter && flutter.postMessage) {
          flutter.postMessage(JSON.stringify({ type, ...payload }));
        }
      } catch (_) {}
    }

    function clearMarkers() {
      markers.forEach((m) => m.remove());
      markers = [];
    }

    function fitStops(stops) {
      const withGps = stops.filter((s) => Number.isFinite(s.lat) && Number.isFinite(s.lng));
      if (!withGps.length) {
        map.jumpTo({ center: [-2.4637, 36.8340], zoom: 10, pitch: 55, bearing: -18 });
        return;
      }
      if (withGps.length === 1) {
        map.flyTo({
          center: [withGps[0].lng, withGps[0].lat],
          zoom: 14, pitch: 60, bearing: -22, essential: true
        });
        return;
      }
      const bounds = new maplibregl.LngLatBounds(
        [withGps[0].lng, withGps[0].lat],
        [withGps[0].lng, withGps[0].lat]
      );
      withGps.forEach((s) => bounds.extend([s.lng, s.lat]));
      map.fitBounds(bounds, { padding: 64, pitch: 58, bearing: -20, duration: 800 });
    }

    function setRoute(payload) {
      const stops = Array.isArray(payload.stops) ? payload.stops : [];
      selectedId = payload.selectedId || null;
      clearMarkers();

      const lineCoords = [];
      stops.forEach((stop, index) => {
        const hasGps = Number.isFinite(stop.lat) && Number.isFinite(stop.lng);
        if (hasGps) lineCoords.push([stop.lng, stop.lat]);

        const el = document.createElement('div');
        el.className = 'marker' +
          (stop.documentId === selectedId ? ' active' : '') +
          (!hasGps ? ' missing' : '');
        el.textContent = String(index + 1);
        el.title = stop.nombreCliente || stop.cliente || '';
        el.addEventListener('click', (ev) => {
          ev.stopPropagation();
          selectedId = stop.documentId;
          markers.forEach((m) => {
            m.getElement().classList.toggle('active', m._docId === selectedId);
          });
          post('markerTap', { documentId: stop.documentId, index });
          if (hasGps) {
            map.easeTo({
              center: [stop.lng, stop.lat],
              zoom: Math.max(map.getZoom(), 13.5),
              pitch: 62,
              duration: 450
            });
          }
        });

        const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
          .setLngLat(hasGps ? [stop.lng, stop.lat] : [-2.4637, 36.8340]);
        marker._docId = stop.documentId;
        if (hasGps) marker.addTo(map);
        markers.push(marker);
      });

      const src = map.getSource('route');
      const geo = {
        type: 'Feature',
        properties: {},
        geometry: { type: 'LineString', coordinates: lineCoords }
      };
      if (src) src.setData(geo);
      else {
        map.addSource('route', { type: 'geojson', data: geo });
        map.addLayer({
          id: 'route-glow',
          type: 'line',
          source: 'route',
          paint: {
            'line-color': '#60a5fa',
            'line-width': 10,
            'line-opacity': 0.25,
            'line-blur': 4
          }
        });
        map.addLayer({
          id: 'route-line',
          type: 'line',
          source: 'route',
          paint: {
            'line-color': '#38bdf8',
            'line-width': 4,
            'line-opacity': 0.95
          }
        });
      }
      fitStops(stops);
      post('ready', { count: stops.length, withGps: lineCoords.length });
    }

    function boot() {
      map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            osm: {
              type: 'raster',
              tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
              tileSize: 256,
              attribution: '© OpenStreetMap'
            }
          },
          layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
        },
        center: [-2.4637, 36.8340],
        zoom: 11,
        pitch: 55,
        bearing: -18,
        antialias: true
      });
      map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
      map.on('load', () => post('mapReady', {}));
      window.setRoute = setRoute;
      window.highlightStop = function (documentId) {
        selectedId = documentId;
        markers.forEach((m) => {
          m.getElement().classList.toggle('active', m._docId === documentId);
        });
      };
    }

    boot();
  </script>
</body>
</html>
