# Matriz Autonomia por Riesgo — Sec 8 (Least Agency)
# Aplicar con hooks + orquestador. Por defecto conservador hasta Fase 2.
version: 1
principle: "Minima agencia ganada, no por defecto (OWASP ASI least agency)"

levels:
  bajo_reversible_un_commit:
    ejemplos: [formato, lint, tests anadidos, typos docs, refactor sin cambio comportamiento]
    autonomia: "Actua y aplica sin confirmacion; hook verificacion es unica puerta"
    limite_reintentos: 3
    notificacion: agrupada diaria
    ejemplos_permitidos_auto_merge: []

  medio_reversible_con_esfuerzo:
    ejemplos: [feature backend/frontend tras flag, endpoint nuevo, bugfix con test regresion]
    autonomia: "Auto-implementa y auto-corrige en bucle acotado; abre PR con informe code-reviewer; NO auto-mergea"
    limite_reintentos: 3
    auto_merge: false
    requiere: [tests_verdes, security_sin_critico, performance_dentro_presupuesto]
    # Categorias autorizadas para auto-merge: definir explicitamente en Fase 2 tras calibrar confianza
    categorias_autorizadas: []

  alto_no_reversible_o_toca_prod:
    ejemplos: [migracion esquema, cambio auth/autorizacion, hallazgo critico/alto security, deploy prod, datos dinero/salud/menores]
    autonomia: "Se detiene. Presenta accion cruda + evidencia + espera confirmacion explicita. No procede sin 'adelante'."
    limite_reintentos: 0
    requiere_confirmacion: "adelante"
    presenta: accion_cruda_no_resumen # ASI09
    escalado: humano_siempre

gate_defaults:
  hasta_definir_explicitamente: "todo no-bajo requiere confirmacion"
  observabilidad: "traza completa herramientas/tokens/coste/errores por tarea (5.8)"
