# GMP App Mobilidad - Docker Compose
# Prod : docker compose up -d
# Dev  : docker compose --profile dev up -d
#
# DB2 is NOT containerized: AS400 stays remote via ODBC DSN (192.168.1.22).
# App credentials live in ONE file: .env.docker (gitignored, never commit).
#   Copy your existing backend runtime values there; compose injects them via
#   env_file so this YAML stays free of credential names and values.

services:
  # ─── Backend API (production image) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: gmp-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3335}:${PORT:-3335}"
    env_file:
      - ./.env.docker
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-A", "GMP-SRE-HealthCheck/1.0", "http://localhost:${PORT:-3335}/api/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gmp-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ─── Redis Cache (L2) ──────────────────────────────────────────────────────
  # Internal network only; host port bound to loopback for local inspection.
  # If you ever expose it beyond loopback, add an ACL/user first.
  redis:
    image: redis:7-alpine
    container_name: gmp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --save
      - 60 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - gmp-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ─── Dev profile ───────────────────────────────────────────────────────────
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: gmp-backend-dev
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "${PORT:-3336}:3335"
    env_file:
      - ./.env.docker
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gmp-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: gmp-redis-commander
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - gmp-network

volumes:
  redis-data:
    driver: local

networks:
  gmp-network:
    driver: bridge